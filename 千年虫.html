<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="《千年虫》：在旧电脑、校园 BBS 和手机消息之间寻找线索的悬疑解谜游戏。">
<title>千年虫</title>
<style>
/* 布局：左边是一台米黄色显示器（里面是 Win98），右边是 2026 年的手机。单一视觉世界，不跟随系统深浅色。 */
:root {
  --room: #121316;
  --bezel: #d9d3c3;
  --bezel-dark: #b9b19c;
  --w-face: #c0c0c0;
  --w-hi: #ffffff;
  --w-lo: #808080;
  --w-dk: #000000;
  --w-title: #000080;
  --w-title2: #1084d0;
  --w-title-off: #808080;
  --w-title-off2: #b5b5b5;
  --desk: #008080;
  --bbs-head: #2e5e86;
  --bbs-row: #eef4fa;
  --bbs-leaf: #2e6b30;
  --ph-bg: #0e1013;
  --ph-card: #181b21;
  --ph-line: #262a32;
  --ph-fg: #e9eaee;
  --ph-sub: #8d93a0;
  --ph-accent: #5aa2ff;
  --ph-me: #2c6a4c;
  --ph-npc: #252931;
  --ph-warn: #e0a84a;
  --ph-bad: #e06a5a;
  --ph-good: #57c08a;
  --amber: #ffb000;
  --font-98: 12px/1.5 SimSun, "宋体", "NSimSun", "Songti SC", "Noto Serif CJK SC", serif;
  --font-hand: KaiTi, "楷体", STKaiti, "Kaiti SC", serif;
  --font-mono: "Fixedsys", "Lucida Console", Consolas, "Courier New", monospace;
  --font-ph: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--room); color: var(--ph-fg); }
body { font-family: var(--font-ph); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px dotted #fff; outline-offset: 1px; }

#app { display: flex; height: 100%; gap: 14px; padding: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

/* ---------- 显示器 ---------- */
#deskwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#monitor { flex: 1; min-height: 0; position: relative; background: linear-gradient(#e2dccd, var(--bezel) 40%, var(--bezel-dark)); border-radius: 14px; padding: 22px 22px 40px; box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.15); }
#monitor .brand { position: absolute; left: 0; right: 0; bottom: 11px; text-align: center; font: 11px/1 var(--font-mono); letter-spacing: .3em; color: #8a826d; }
#monitor .led { position: absolute; right: 30px; bottom: 15px; width: 8px; height: 8px; border-radius: 50%; background: #3b3b3b; }
#monitor .led.on { background: #5cff6b; box-shadow: 0 0 6px #5cff6b; }
#screen { position: relative; isolation: isolate; width: 100%; height: 100%; background: #000; overflow: hidden; border-radius: 6px; box-shadow: inset 0 0 0 2px #1d1d1d, inset 0 0 30px rgba(0,0,0,.8); font: var(--font-98); color: #000; }
#screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); z-index: 9000; border-radius: 6px; }

/* 关机/开机画面 */
.off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #050505; color: #6f6f6f; font: 13px/1.6 var(--font-ph); text-align: center; padding: 20px; }
.power { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #555; background: radial-gradient(#2a2a2a, #111); cursor: pointer; display: grid; place-items: center; color: #8f8; font-size: 26px; }
.power:hover { border-color: #8f8; box-shadow: 0 0 18px rgba(120,255,120,.35); }
.bios { position: absolute; inset: 0; background: #000; color: #c8c8c8; font: 14px/1.45 var(--font-mono); padding: 18px 22px; white-space: pre-wrap; overflow: auto; }
.bios .hl { color: #fff; }
.bios-pass { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(520px, 92%); background: #0000aa; color: #fff; border: 2px double #fff; padding: 16px 18px; font: 14px/1.5 var(--font-mono); box-shadow: 8px 8px 0 #000; }
.bios-pass input { background: #000; color: #fff; border: 1px solid #aaa; font: inherit; padding: 2px 6px; width: 100%; margin-top: 6px; }
.bios-pass .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.bios-pass button { background: #aaa; color: #000; border: 0; padding: 2px 10px; font: inherit; cursor: pointer; }
.bios-pass .msg { min-height: 1.5em; color: #ff5; }
.bios-pass .prompt { white-space: normal; }
.splash { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; }
.splash .logo { font: italic 700 44px/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; }
.splash .logo b { color: #ffb43a; font-style: normal; }
.splash .bar { width: 200px; height: 10px; border: 1px solid #555; overflow: hidden; }
.splash .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, #2a7cff, #6bf, transparent); animation: slide 1.2s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.login98 { position: absolute; inset: 0; background: var(--desk); display: grid; place-items: center; }

/* ---------- Win98 基础控件 ---------- */
.out { background: var(--w-face); box-shadow: inset -1px -1px var(--w-dk), inset 1px 1px var(--w-hi), inset -2px -2px var(--w-lo), inset 2px 2px #dfdfdf; }
.in { background: #fff; box-shadow: inset -1px -1px var(--w-hi), inset 1px 1px var(--w-lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--w-dk); }
.b98 { font: var(--font-98); min-width: 72px; padding: 3px 10px; background: var(--w-face); border: 0; color: #000; cursor: pointer; box-shadow: inset -1px -1px var(--w-dk), inset 1px 1px var(--w-hi), inset -2px -2px var(--w-lo), inset 2px 2px #dfdfdf; }
.b98:active, .b98.down { box-shadow: inset -1px -1px var(--w-hi), inset 1px 1px var(--w-dk), inset -2px -2px #dfdfdf, inset 2px 2px var(--w-lo); }
.b98:disabled { color: var(--w-lo); text-shadow: 1px 1px #fff; cursor: default; }
.b98:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
.f98 { font: var(--font-98); padding: 3px 4px; border: 0; background: #fff; color: #000; box-shadow: inset -1px -1px var(--w-hi), inset 1px 1px var(--w-lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--w-dk); min-width: 0; }
.f98:focus { outline: none; }
.sep98 { height: 2px; border-top: 1px solid var(--w-lo); border-bottom: 1px solid var(--w-hi); margin: 4px 0; }

/* ---------- 桌面 ---------- */
#desktop { position: absolute; inset: 0 0 28px 0; background: var(--desk); overflow: hidden; }
#icons { position: absolute; inset: 8px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 6px 4px; pointer-events: none; }
.icon { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 2px; cursor: default; color: #fff; text-align: center; pointer-events: auto; user-select: none; }
.icon svg { width: 32px; height: 32px; flex: none; }
.icon span { padding: 0 2px; line-height: 1.3; word-break: break-all; text-shadow: 1px 1px 0 rgba(0,0,0,.4); }
.icon.sel span { background: var(--w-title); outline: 1px dotted #ff0; }
.icon.sel svg { filter: brightness(.6) sepia(1) hue-rotate(190deg) saturate(4); }
#taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; display: flex; align-items: center; gap: 4px; padding: 2px; z-index: 5000; }
#startbtn { min-width: 0; display: flex; align-items: center; gap: 4px; font-weight: bold; padding: 2px 6px; height: 22px; }
#startbtn svg { width: 16px; height: 16px; }
#tasks { flex: 1; min-width: 0; display: flex; gap: 3px; overflow: hidden; }
.task { flex: 0 1 150px; min-width: 40px; height: 22px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; padding: 0 6px; }
.task svg { width: 16px; height: 16px; flex: none; }
.task.on { background: repeating-conic-gradient(#fff 0 25%, #c0c0c0 0 50%) 0 0/2px 2px; }
#tray { height: 22px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-variant-numeric: tabular-nums; }
#startmenu { position: absolute; left: 2px; bottom: 28px; width: 210px; display: flex; z-index: 6000; padding: 2px; }
#startmenu .side { width: 22px; background: linear-gradient(to top, var(--w-title), var(--w-title2)); color: #c0c0c0; writing-mode: vertical-rl; transform: rotate(180deg); font: bold 15px/22px Arial, sans-serif; padding: 6px 0; letter-spacing: .05em; }
#startmenu .side b { color: #fff; }
#startmenu ul { list-style: none; margin: 0; padding: 0; flex: 1; }
#startmenu li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: default; }
#startmenu li svg { width: 24px; height: 24px; }
#startmenu li:hover { background: var(--w-title); color: #fff; }

/* ---------- 窗口 ---------- */
.win { position: absolute; display: flex; flex-direction: column; padding: 3px; min-width: 200px; min-height: 120px; max-width: 100%; max-height: 100%; }
.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
.win.max > .grip { display: none; }
.titlebar { flex: none; height: 24px; display: flex; align-items: center; gap: 4px; padding: 0 2px 0 3px; background: linear-gradient(90deg, var(--w-title-off), var(--w-title-off2)); color: #d6d6d6; font-weight: bold; user-select: none; touch-action: none; }
.win.active .titlebar { background: linear-gradient(90deg, var(--w-title), var(--w-title2)); color: #fff; }
.titlebar svg { width: 16px; height: 16px; flex: none; }
.titlebar .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.b98.tbb { width: 20px; height: 18px; min-width: 20px; flex: none; padding: 0; display: grid; place-items: center; font: bold 14px/1 Arial, sans-serif; }
.b98.tbb:hover { background: #d5d5d5; }
.b98.tbb:focus-visible { outline-offset: -4px; }
.window-symbol { width: 10px; height: 10px; position: relative; display: block; }
.window-symbol::before, .window-symbol::after { content: ""; position: absolute; }
.window-symbol.min::before { left: 0; bottom: 0; width: 8px; border-bottom: 2px solid #000; }
.window-symbol.max::before { inset: 0; border: 1px solid #000; border-top-width: 2px; }
.window-symbol.restore::before { left: 3px; top: 0; width: 7px; height: 7px; border: 1px solid #000; border-top-width: 2px; }
.window-symbol.restore::after { left: 0; top: 3px; width: 7px; height: 7px; background: var(--w-face); border: 1px solid #000; border-top-width: 2px; }
.window-symbol.close::before, .window-symbol.close::after { left: 4px; top: -1px; height: 12px; border-left: 2px solid #000; transform: rotate(45deg); }
.window-symbol.close::after { transform: rotate(-45deg); }
.menubar { flex: none; display: flex; gap: 0; padding: 1px 0; position: relative; }
.menubar > div { padding: 1px 7px; cursor: default; position: relative; }
.menubar > div:hover, .menubar > div.open { background: var(--w-title); color: #fff; }
.dropdown { position: absolute; left: 0; top: 100%; min-width: 170px; z-index: 50; padding: 2px; color: #000; }
.dropdown div { padding: 3px 20px; white-space: nowrap; }
.dropdown div:hover { background: var(--w-title); color: #fff; }
.dropdown div.chk::before { content: "✓"; position: absolute; left: 8px; }
.dropdown div { position: relative; }
.toolbar98 { flex: none; display: flex; gap: 4px; align-items: center; padding: 3px 2px; flex-wrap: wrap; }
.toolbar98 .b98 { min-width: 0; padding: 2px 8px; }
.addr { flex: none; display: flex; align-items: center; gap: 4px; padding: 2px; }
.addr .f98 { flex: 1; }
.wbody { flex: 1; min-height: 0; overflow: auto; position: relative; }
.wbody.in { background: #fff; }
.status98 { flex: none; display: flex; gap: 3px; padding-top: 2px; }
.status98 > div { flex: 1; padding: 1px 4px; box-shadow: inset -1px -1px var(--w-hi), inset 1px 1px var(--w-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grip { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 50%, var(--w-lo) 50% 56%, transparent 56% 66%, var(--w-lo) 66% 72%, transparent 72% 82%, var(--w-lo) 82% 88%, transparent 88%); }

/* 资源管理器 */
.flist { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 8px; min-height: 100%; }
.flist .icon { color: #000; width: 82px; }
.flist .icon span { text-shadow: none; }
.flist .icon.sel span { color: #fff; }
.flist .icon.hid { opacity: .55; }
table.det { border-collapse: collapse; width: 100%; font: var(--font-98); }
table.det th { position: sticky; top: 0; text-align: left; font-weight: normal; padding: 2px 6px; white-space: nowrap; cursor: default; }
table.det td { padding: 1px 6px; white-space: nowrap; }
table.det tr.sel td { background: var(--w-title); color: #fff; }
table.det td.nm { display: flex; align-items: center; gap: 4px; }
table.det td.nm svg { width: 16px; height: 16px; }
.empty98 { padding: 20px; color: #666; }

/* 记事本 / 写字板 / 看图 */
.note { margin: 0; padding: 6px 8px; font: 13px/1.6 SimSun, "宋体", "NSimSun", monospace; white-space: pre-wrap; word-break: break-all; color: #000; min-height: 100%; background: #fff; }
.wordpad { background: #808080; padding: 16px; min-height: 100%; }
.wordpad .page { background: #fff; color: #000; max-width: 640px; margin: 0 auto; padding: 36px 40px; font: 14px/1.9 SimSun, "宋体", serif; box-shadow: 2px 2px 0 #404040; }
.imgview { background: #808080; min-width: 100%; width: max-content; min-height: 100%; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.imgview .canvas { flex: none; background: #fff; box-shadow: 2px 2px 0 #404040; cursor: zoom-in; }
.imgview .canvas svg { display: block; width: 100%; height: auto; }
.imgview .canvas > .photo { width: 100%; max-width: none; }
.imgview .cap { color: #fff; max-width: 640px; text-align: center; }

/* 磁带播放器 */
.deck { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.cassette { position: relative; height: 120px; border-radius: 6px; background: linear-gradient(#3c3c3c, #262626); border: 2px solid #111; display: flex; align-items: center; justify-content: center; gap: 70px; }
.cassette .lbl { position: absolute; top: 8px; left: 16px; right: 16px; height: 26px; background: #f3edd8; color: #222; font: 15px/26px var(--font-hand); padding: 0 8px; border-radius: 2px; overflow: hidden; white-space: nowrap; }
.reel { width: 46px; height: 46px; border-radius: 50%; background: repeating-conic-gradient(#ddd 0 30deg, #888 30deg 60deg); border: 4px solid #eee; margin-top: 26px; }
.playing .reel { animation: spin var(--spd, 1.5s) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.deck .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deck .ctrl input[type=range] { flex: 1; min-width: 120px; }
.deck .spd { font: bold 13px var(--font-mono); min-width: 52px; }
.deck .ticks { display: flex; justify-content: space-between; font-size: 11px; color: #333; padding: 0 2px; }
.deck .tr { min-height: 120px; padding: 8px 10px; font: 14px/1.8 SimSun, serif; white-space: pre-wrap; color: #000; }

/* 压缩包 */
.zipv { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.zipv .cmt { padding: 6px 8px; min-height: 40px; white-space: pre-wrap; }

/* 鸽讯 */
.gx { display: flex; height: 100%; min-height: 0; }
.gx .left { width: 170px; flex: none; overflow: auto; background: #fff; border-right: 1px solid #808080; }
.gx .grp { padding: 3px 6px; background: #dde8f4; font-weight: bold; color: #234; }
.gx .ct { display: flex; align-items: center; gap: 6px; padding: 4px 6px; cursor: default; }
.gx .ct:hover { background: #eef4fb; }
.gx .ct.sel { background: #cfe0f5; }
.gx .ct .av { width: 22px; height: 22px; border-radius: 3px; background: #6a9ad0; color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
.gx .ct.none .av { background: #aaa; }
.gx .ct small { color: #777; }
.gx .right { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }
.gx .dates { flex: none; display: flex; flex-wrap: wrap; gap: 3px; padding: 5px; border-bottom: 1px solid #ccc; background: #f4f7fb; }
.gx .dates .b98 { min-width: 0; padding: 1px 6px; }
.gx .log { flex: 1; overflow: auto; padding: 8px 10px; }
.gx .ln { margin-bottom: 6px; }
.gx .ln .h { color: #2b6a2b; }
.gx .ln.me .h { color: #1b3f9a; }
.gx .ln .x { padding-left: 1.5em; white-space: pre-wrap; word-break: break-all; }
.gx-login { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(#e8f1fb, #c8dcf2); padding: 16px; }
.gx-login .logo { font: bold 22px/1 var(--font-hand); color: #1b4f8a; }

/* IE + BBS */
.ie-body { background: #fff; color: #000; }
.bbs { font: 12px/1.6 SimSun, "宋体", serif; color: #000; padding: 0 0 20px; min-width: 0; }
.bbs a { color: #0645ad; text-decoration: none; cursor: pointer; }
.bbs a:hover { text-decoration: underline; color: #c00; }
.bbs .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 12px 6px; border-bottom: 3px solid var(--bbs-leaf); background: linear-gradient(#f4f9ef, #fff); }
.bbs .logo { font: bold 28px/1 var(--font-hand); color: var(--bbs-leaf); letter-spacing: .08em; }
.bbs .logo small { font: 12px SimSun, serif; color: #6a8a5a; letter-spacing: 0; margin-left: 6px; }
.bbs .nav { display: flex; gap: 10px; flex-wrap: wrap; }
.bbs .crumb { padding: 6px 12px; background: #f6f6f6; border-bottom: 1px solid #ddd; }
.bbs .wrap { padding: 8px 12px; overflow-x: auto; }
.bbs table.t { border-collapse: collapse; width: 100%; background: #9fb6cc; border-spacing: 1px; border: 1px solid #9fb6cc; }
.bbs table.t th { background: var(--bbs-head); color: #fff; font-weight: normal; padding: 4px 6px; text-align: left; white-space: nowrap; }
.bbs table.t th.s { cursor: pointer; text-decoration: underline; }
.bbs table.t td { background: #fff; padding: 4px 6px; border: 1px solid #c9d7e5; vertical-align: top; }
.bbs table.t tr:nth-child(even) td { background: var(--bbs-row); }
.bbs .notice { margin: 8px 12px; padding: 8px 10px; border: 1px dashed #b8c9a8; background: #fbfdf7; }
.bbs .post { display: flex; border: 1px solid #9fb6cc; margin-bottom: 6px; }
.bbs .post .who { width: 130px; flex: none; background: #eef4fa; padding: 8px; border-right: 1px solid #c9d7e5; word-break: break-all; }
.bbs .post .who b { color: #1b3f9a; font-size: 13px; }
.bbs .post .who .tt { color: #b45f06; }
.bbs .post .body { flex: 1; min-width: 0; padding: 8px 10px; display: flex; flex-direction: column; }
.bbs .post .meta { color: #777; border-bottom: 1px dotted #ccc; padding-bottom: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.bbs .post .content { font-size: 13px; line-height: 1.8; word-break: break-word; flex: 1; }
.bbs .post .sig { margin-top: 10px; padding-top: 4px; border-top: 1px dashed #ccc; color: #888; }
.bbs .delbar { background: #fee; border: 1px solid #e99; color: #a00; padding: 6px 10px; margin-bottom: 6px; }
.bbs h2 { font-size: 16px; margin: 4px 0 8px; }
.bbs .err { padding: 40px 20px; }
.bbs .err h1 { font: bold 18px Arial, SimSun, sans-serif; margin: 0 0 10px; }
.bbs .admin { background: #fff8e6; }
.bbs .form { display: flex; flex-direction: column; gap: 8px; max-width: 360px; margin: 20px auto; padding: 14px; border: 1px solid #9fb6cc; background: #f6f9fc; }
.bbs .form .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bbs .form input { font: inherit; padding: 2px 4px; border: 1px solid #7a96b0; }
.bbs .form .msg { color: #c00; min-height: 1.4em; }
.bbs .hl { background: #ff0; }
.bbs .ux { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.bbs .uxbox { margin-top: 8px; padding: 10px; border: 1px solid #ccc; background: #fafafa; }
@media (max-width: 640px) { .bbs .post { flex-direction: column; } .bbs .post .who { width: auto; border-right: 0; border-bottom: 1px solid #c9d7e5; } }

/* 文档里可用的样式类 */
.paper { background: #fffef6 repeating-linear-gradient(transparent 0 27px, #c9d6e8 27px 28px); padding: 14px 18px; line-height: 28px; color: #1a1a1a; }
.scan { background: #efe6cc; color: #2a2418; padding: 16px 18px; box-shadow: inset 0 0 40px rgba(120,90,30,.25); filter: contrast(1.02); }
.hand { font-family: var(--font-hand); font-size: 1.12em; }
.stamp { display: inline-block; color: #c22; border: 2px solid #c22; border-radius: 4px; padding: 0 6px; transform: rotate(-8deg); font-weight: bold; opacity: .85; }
.mono { font-family: var(--font-mono); }
.faded { opacity: .45; }
.redact { background: #111; color: #111; padding: 0 .2em; }
.torn { clip-path: polygon(0 0, 100% 0, 100% 86%, 94% 92%, 88% 87%, 80% 95%, 72% 88%, 63% 94%, 55% 86%, 46% 93%, 38% 87%, 29% 95%, 20% 88%, 11% 94%, 0 87%); }
.photo { background: #fff; padding: 10px 10px 28px; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: block; width: min(640px, 100%); }
.photo svg, .photo img { display: block; width: 100%; height: auto; }
.datestamp { font: bold 18px var(--font-mono); color: #ff8a1c; text-shadow: 0 0 4px rgba(255,120,0,.8); letter-spacing: .1em; }
.red { color: #c00; }

/* 对话框 */
.dlg98 { position: fixed; z-index: 9450; width: min(460px, calc(100% - 20px)); left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 3px; display: flex; flex-direction: column; max-height: calc(100% - 20px); }
.dlg98 .wbody { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.dlg98 .prompt { line-height: 1.7; }
.dlg98 .prompt p { margin: 0 0 6px; }
.dlg98 .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg98 .msg { min-height: 1.5em; color: #a00; }
.dlg98 .msg.ok { color: #060; }
.dlg98 .hints { display: flex; flex-direction: column; gap: 4px; }
.dlg98 .hints div { padding: 4px 6px; background: #ffffe1; border: 1px solid #999; }
.dlg98 .opts { display: flex; flex-direction: column; gap: 4px; }
.dlg98 .opts label { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
.dlg98 .fields { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
.dlgph { background: #171a20; color: #e9eaee; border-radius: 16px; border: 1px solid #333a46; box-shadow: 0 24px 70px rgba(0,0,0,.6); padding: 0; font: 14px/1.6 var(--font-ph); width: min(440px, calc(100% - 24px)); }
.dlgph .titlebar { background: none !important; color: #e9eaee; height: auto; padding: 14px 16px 0; font-size: 15px; }
.dlgph .titlebar svg { display: none; }
.dlgph .titlebar .tbb { background: none; box-shadow: none; color: #8d93a0; font-size: 16px; width: 24px; height: 24px; }
.dlgph .wbody { background: none; padding: 10px 16px 16px; }
.dlgph .prompt { color: #d5d8de; }
.dlgph .f98 { background: #0b0d10; color: #fff; box-shadow: none; border: 1px solid #3a4150; border-radius: 10px; padding: 8px 10px; font: 15px var(--font-ph); }
.dlgph .b98 { background: #232833; color: #e9eaee; box-shadow: none; border: 1px solid #3a4150; border-radius: 10px; padding: 7px 14px; font: 13px var(--font-ph); }
.dlgph .row .b98:last-child { background: var(--ph-accent); color: #061223; border-color: var(--ph-accent); font-weight: 600; }
.dlgph .hints div { background: #2a2614; border-color: #6a5a20; color: #f2e3b0; border-radius: 8px; }
.dlgph .msg { color: var(--ph-bad); }
.dlgph .msg.ok { color: var(--ph-good); }
.dlgph .opts label { padding: 4px 0; }
.dlgph .fields label { color: #aab; }
.shade { position: fixed; inset: 0; z-index: 9400; background: rgba(0,0,0,.25); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translate(calc(-50% - 6px), -50%); } 40%, 80% { transform: translate(calc(-50% + 6px), -50%); } }
.ctx { position: absolute; z-index: 7100; padding: 2px; min-width: 120px; }
.ctx div { padding: 3px 18px; }
.ctx div:hover { background: var(--w-title); color: #fff; }

/* 屏保 */
#saver { position: absolute; inset: 0; background: #000; z-index: 8000; overflow: hidden; cursor: none; }
#saver .mq { position: absolute; white-space: nowrap; font: 34px/1 var(--font-hand); color: #ffd84a; animation: mq 22s linear infinite; }
@keyframes mq { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

/* ---------- 手机 ---------- */
#phone { width: 370px; flex: none; display: flex; flex-direction: column; background: var(--ph-bg); border-radius: 28px; border: 8px solid #23262c; box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden; position: relative; }
.ph-status { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 4px; font-size: 12px; color: var(--ph-sub); font-variant-numeric: tabular-nums; }
.ph-status b { color: var(--ph-fg); font-weight: 600; }
.ph-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ph-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; border-bottom: 1px solid var(--ph-line); min-height: 50px; }
.ph-head h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-head small { display: block; font-size: 11px; color: var(--ph-sub); font-weight: 400; }
.ph-back { border: 0; background: none; color: var(--ph-accent); font-size: 22px; padding: 0 6px 0 0; cursor: pointer; line-height: 1; }
.ph-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
.ph-tabs { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--ph-line); background: #121418; padding: 4px 2px 8px; }
.ph-tabs button { border: 0; background: none; color: var(--ph-sub); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; cursor: pointer; position: relative; }
.ph-tabs button svg { width: 22px; height: 22px; }
.ph-tabs button.on { color: var(--ph-accent); }
.badge { position: absolute; top: 0; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--ph-bad); color: #fff; font-size: 10px; line-height: 16px; padding: 0 4px; text-align: center; }
.badge.dot { min-width: 8px; width: 8px; height: 8px; padding: 0; top: 3px; right: calc(50% - 14px); }
.ph-list { display: flex; flex-direction: column; gap: 2px; }
.ph-item { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.ph-item:hover { background: var(--ph-card); }
.ph-item .av { width: 42px; height: 42px; border-radius: 50%; background: #37415a; display: grid; place-items: center; font-size: 17px; flex: none; color: #fff; }
.ph-item .mid { flex: 1; min-width: 0; }
.ph-item .mid b { display: block; font-weight: 600; font-size: 15px; }
.ph-item .mid span { display: block; color: var(--ph-sub); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ph-item .rt { color: var(--ph-sub); font-size: 11px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.ph-item .cnt { background: var(--ph-bad); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; line-height: 18px; }
.chat { display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; }
.bub { max-width: 82%; padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
.bub.npc { align-self: flex-start; background: var(--ph-npc); border-bottom-left-radius: 4px; }
.bub.me { align-self: flex-end; background: var(--ph-me); border-bottom-right-radius: 4px; }
.bub.sys { align-self: center; background: none; color: var(--ph-sub); font-size: 12px; padding: 2px 8px; text-align: center; }
.bub .pic { margin-top: 6px; background: #fff; border-radius: 8px; overflow: hidden; cursor: zoom-in; }
.bub.media { width: 82%; }
.bub .pic { white-space: normal; color: #1b1b1b; }
.bub .pic svg { display: block; width: 100%; height: auto; }
.bub.typing { color: var(--ph-sub); }
.bub.typing i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ph-sub); margin: 0 2px; animation: blink 1s infinite; }
.bub.typing i:nth-child(2) { animation-delay: .2s; } .bub.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }
.chat-day { align-self: center; color: var(--ph-sub); font-size: 11px; margin: 6px 0; }
.ph-choices { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--ph-line); max-height: 40%; overflow: auto; }
.ph-reply-label { font-size: 12px; color: var(--ph-sub); }
.chat-latest { flex: none; border: 1px solid var(--ph-line); border-radius: 12px; padding: 4px 8px; background: var(--ph-card); color: var(--ph-accent); cursor: pointer; font-size: 12px; }
.ph-btn { border: 1px solid #3a4150; background: var(--ph-card); color: var(--ph-fg); border-radius: 12px; padding: 9px 12px; text-align: left; cursor: pointer; font-size: 14px; line-height: 1.45; }
.ph-btn:hover { border-color: var(--ph-accent); }
.ph-btn.pri { background: var(--ph-accent); border-color: var(--ph-accent); color: #061223; font-weight: 600; text-align: center; }
.ph-btn.sm { padding: 6px 10px; font-size: 13px; }
.ph-sec { margin: 12px 2px 6px; font-size: 12px; color: var(--ph-sub); letter-spacing: .08em; display: flex; justify-content: space-between; }
.ph-card { background: var(--ph-card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
.ph-card.q { border-left: 3px solid var(--ph-warn); cursor: pointer; }
.ph-card.q:hover { background: #1f232b; }
.ph-card .k { font-size: 11px; color: var(--ph-sub); }
.ph-card.done { opacity: .6; }
.ph-empty { color: var(--ph-sub); text-align: center; padding: 30px 10px; font-size: 13px; line-height: 1.7; }
.ph-mail { background: #f6f4ef; color: #1d1d1d; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.75; }
.ph-mail .mh { font-size: 12px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 10px; }
.ph-mail svg { max-width: 100%; height: auto; }
.ph-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.ph-tile { background: var(--ph-card); border-radius: 14px; padding: 12px; cursor: pointer; border: 0; text-align: left; color: var(--ph-fg); min-height: 70px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; font-size: 14px; }
.ph-tile:hover { background: #20242c; }
.ph-tile small { color: var(--ph-sub); font-size: 11px; }
.ph-tile.new::after { content: "新"; align-self: flex-start; font-size: 10px; background: var(--ph-bad); color: #fff; border-radius: 6px; padding: 0 5px; }
.ph-view { background: #f4f1ea; color: #1b1b1b; border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.7; }
.ph-view svg { max-width: 100%; height: auto; display: block; }
.table-scroll { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }
.table-scroll > table { min-width: 480px; }
.table-scroll svg[width] { max-width: none; }
.table-hint { color: #666; font-size: 12px; margin: 4px 0; }
.ph-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ph-row .ph-btn { flex: 1; text-align: center; }
.ph-input { width: 100%; background: #0b0d10; border: 1px solid #3a4150; color: var(--ph-fg); border-radius: 10px; padding: 8px 10px; font: 13px/1.5 var(--font-mono); }
.slot-card { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slot-card .ph-row { flex: none; }

/* 推理板 */
#overlay { position: fixed; inset: 0; z-index: 9500; display: none; }
#overlay.on { display: block; }
.board { position: absolute; inset: 0; background: rgba(8,9,11,.92); display: flex; flex-direction: column; align-items: center; overflow: auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
.board .sheet { width: min(860px, 100%); background: #f3eee2; color: #1f1b14; border-radius: 4px; padding: 26px 30px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); font: 16px/2.3 SimSun, "宋体", serif; }
.board h2 { margin: 0 0 4px; font: bold 22px/1.3 var(--font-hand); letter-spacing: .1em; }
.board .intro { font: 13px/1.6 var(--font-ph); color: #6b6253; margin-bottom: 14px; }
.board .txt { margin-bottom: 16px; }
.slot { display: inline-block; min-width: 5.5em; padding: 0 .4em; margin: 0 .15em; line-height: 1.6; border: 0; border-bottom: 2px solid #8a7d64; background: rgba(140,120,80,.12); color: #1f1b14; font: inherit; cursor: pointer; border-radius: 3px 3px 0 0; text-align: center; vertical-align: baseline; }
.slot.empty { color: #a39885; }
.slot.act { background: #ffe58a; border-color: #b8860b; }
.slot.drop { background: #d6ecff; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px dashed #b9ad94; position: sticky; bottom: -22px; background: #f3eee2; margin: 0 -30px -22px; padding: 12px 30px 18px; }
.chip { border: 1px solid #8a7d64; background: #fffaf0; border-radius: 4px; padding: 3px 10px; font: 14px/1.5 SimSun, serif; cursor: grab; color: #1f1b14; }
.chip:hover { background: #fff1c9; }
.board .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font: 13px var(--font-ph); }
.board .bar .res { flex: 1; min-width: 140px; font-weight: 600; }
.board .bar .res.ok { color: #1d7a45; }
.board .bar .res.bad { color: #a8452f; }
.bbtn { border: 1px solid #6b6253; background: #fff; color: #1f1b14; border-radius: 6px; padding: 6px 14px; cursor: pointer; font: 13px var(--font-ph); }
.bbtn.pri { background: #1f1b14; color: #f3eee2; }
.board .hintbox { font: 13px/1.6 var(--font-ph); background: #fff6d6; border: 1px solid #e0c46c; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; }
.board .solved { font: 14px/1.7 var(--font-ph); background: #e3f3e7; border: 1px solid #8fc9a0; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }

/* 章节卡、结局、标题 */
.card { position: absolute; inset: 0; background: #000; color: #ddd; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); text-align: center; cursor: pointer; animation: fade .8s; }
@keyframes fade { from { opacity: 0; } }
.card .num { font: 14px/1 var(--font-mono); letter-spacing: .6em; color: var(--amber); }
.card h1 { margin: 0; font: 46px/1.2 var(--font-hand); letter-spacing: .3em; color: #f2f2f2; text-wrap: balance; }
.card .date { font: 13px/1 var(--font-mono); color: #888; letter-spacing: .2em; }
.card .intro { max-width: 34em; font: 15px/2 SimSun, serif; color: #b9b9b9; }
.card .go { font: 12px var(--font-ph); color: #666; margin-top: 10px; }
.ending { position: absolute; inset: 0; background: #050505; color: #ccc; overflow: auto; padding: 50px max(16px, env(safe-area-inset-left, 0px)) 50px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; animation: fade 1.6s; }
.ending .in2 { width: min(640px, 100%); }
.ending .num { font: 13px var(--font-mono); letter-spacing: .5em; color: var(--amber); }
.ending h1 { font: 40px/1.3 var(--font-hand); letter-spacing: .2em; margin: 10px 0 28px; color: #eee; }
.ending .body { font: 16px/2.1 SimSun, serif; color: #c4c4c4; }
.ending .body p { margin: 0 0 1.1em; }
.ending .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 30px; }
.title { position: fixed; inset: 0; z-index: 9600; background: radial-gradient(ellipse at 50% 40%, #1b1d22, #050506 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); text-align: center; overflow: auto; }
.title .clock { font: 15px/1 var(--font-mono); color: var(--amber); letter-spacing: .25em; text-shadow: 0 0 8px rgba(255,176,0,.6); }
.title h1 { margin: 0; font: 84px/1 var(--font-hand); letter-spacing: .25em; color: #f1efe9; text-shadow: 0 0 30px rgba(255,255,255,.08); }
.title h1 span { display: inline-block; animation: glitch 6s infinite; }
@keyframes glitch { 0%, 92%, 100% { transform: none; opacity: 1; } 93% { transform: translateX(3px); opacity: .6; } 95% { transform: translateX(-2px) skewX(8deg); } 97% { opacity: .85; } }
.title .sub { font: 14px/1.8 SimSun, serif; color: #8d8d8d; letter-spacing: .3em; }
.title .menu { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; width: min(280px, 100%); }
.tbtn { border: 1px solid #3a3d44; background: rgba(255,255,255,.03); color: #ddd; padding: 11px 16px; border-radius: 4px; cursor: pointer; font: 15px var(--font-ph); letter-spacing: .15em; }
.tbtn:hover { border-color: var(--amber); color: #fff; }
.tbtn:disabled { opacity: .35; cursor: default; }
.title .foot { position: absolute; bottom: 14px; left: 0; right: 0; font: 11px var(--font-ph); color: #555; }
.panel { width: min(440px, 100%); background: #14161a; border: 1px solid #2c3038; border-radius: 10px; padding: 16px; text-align: left; font-size: 14px; line-height: 1.7; color: #ddd; }
.panel h3 { margin: 0 0 10px; font-size: 16px; }
.panel input[type=text] { width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid #3a3d44; background: #0b0c0e; color: #fff; font-size: 15px; }
.panel .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.panel .muted { color: #888; font-size: 13px; }
.endgrid { display: grid; gap: 6px; margin: 8px 0; }
.endgrid div { padding: 8px 10px; border-radius: 6px; background: #1d2026; display: flex; justify-content: space-between; gap: 8px; }
.endgrid div.no { color: #555; }

#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 9800; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.tst { background: rgba(20,22,26,.95); color: #f0f0f0; border: 1px solid #3a3f4a; border-radius: 10px; padding: 9px 14px; font: 13px/1.5 var(--font-ph); box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: tin .25s; text-align: center; }
.tst.good { border-color: #3d8a5c; }
@keyframes tin { from { transform: translateY(10px); opacity: 0; } }
.viewer { position: absolute; inset: 0; background: rgba(0,0,0,.88); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.viewer-panel { width: min(1100px, 100%); height: 100%; min-height: 0; display: flex; flex-direction: column; background: #181b21; border: 1px solid #3a4150; border-radius: 8px; overflow: hidden; }
.viewer-toolbar { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px; border-bottom: 1px solid #3a4150; }
.viewer-toolbar .ph-btn { padding: 6px 10px; border-radius: 6px; }
.viewer-toolbar output { min-width: 4em; text-align: center; font: 13px var(--font-mono); }
.viewer-close { margin-left: auto; }
.viewer-scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px; overscroll-behavior: contain; }
.viewer-canvas { margin: 0 auto; background: #fff; color: #1b1b1b; }
.viewer-canvas svg, .viewer-canvas img { display: block; width: 100%; max-width: none; height: auto; }
.viewer-canvas > .photo { width: 100%; max-width: none; }
.viewer-scroll.pannable { cursor: grab; }
.viewer-scroll.dragging { cursor: grabbing; user-select: none; }
.viewer-toolbar button:disabled { opacity: .45; cursor: default; }

.ph-close { display: none; border: 0; background: none; color: var(--ph-sub); font-size: 13px; padding: 8px; cursor: pointer; }
#phoneFab { display: none; }
@media (max-width: 960px) {
  #app { padding: 0; gap: 0; }
  #monitor { border-radius: 0; padding: 0 0 0; background: #000; box-shadow: none; }
  #monitor .brand, #monitor .led { display: none; }
  #screen { border-radius: 0; }
  #phone { position: fixed; inset: 0; width: auto; border-radius: 0; border: 0; z-index: 9000; transform: translateX(105%); transition: transform .25s; padding-top: env(safe-area-inset-top, 0px); }
  #phone.open { transform: none; }
  #phoneFab { display: grid; position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 40px; z-index: 9100; width: 52px; height: 52px; border-radius: 50%; border: 0; background: #1d2128; color: #fff; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.5); cursor: pointer; }
  #phoneFab svg { width: 26px; height: 26px; }
  #phoneFab .badge { top: 2px; right: 2px; }
  .ph-close { display: inline-block; }
  #phone.open ~ #phoneFab { display: none; }
  .title h1 { font-size: 60px; }
  .board .sheet { padding: 18px 16px; font-size: 15px; }

  function machineNow() {
    const m = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(S.clock || '1900-01-01 00:00');
    const base = new Date(+m[1] < 1970 ? 2000 : +m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    const d = new Date(base.getTime() + (Date.now() - S.clockAt));
    const y = +m[1] < 1970 ? +m[1] + (d.getFullYear() - 2000) : d.getFullYear();
    return { y, mo: d.getMonth() + 1, d: d.getDate(), hm: `${pad(d.getHours())}:${pad(d.getMinutes())}` };
  }
  function phoneNow() {
    const t = S.chTime || { date: '2026-10-27', time: '21:40', at: Date.now() };
    const [hh, mm] = t.time.split(':').map(Number);
    const mins = hh * 60 + mm + Math.floor((Date.now() - t.at) / 60000);
    const dd = Math.floor(mins / 1440);
    const [y, mo, d] = t.date.split('-').map(Number);
    const day = new Date(y, mo - 1, d + dd);
    const M = day.getMonth() + 1, Dd = day.getDate(), w = day.getDay();
    const date = LANG === 'en' ? `${'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[M - 1]} ${Dd}` : `${M}月${Dd}日`;
    const wk = LANG === 'en' ? 'Sun Mon Tue Wed Thu Fri Sat'.split(' ')[w] : LANG === 'ja' ? '(' + '日月火水木金土'[w] + ')' : '周' + '日一二三四五六'[w];
    return { date, hm: `${pad(Math.floor(mins / 60) % 24)}:${pad(mins % 60)}`, wk };
  }

  function solved(id) { return !!S.flags['solved_' + id]; }
  function checkPuzzle(p, val) {
    const kind = p.kind || 'text';
    if (kind === 'text') return (p.answers || []).some(a => norm(a) === norm(val));
    if (kind === 'choice') return val === p._ai;
    if (kind === 'pick') { const set = new Set(val); return set.size === p._as.length && p._as.every(a => set.has(a)); }
    if (kind === 'multi') return p.fields.every((f, i) => (f.answers || []).some(a => norm(a) === norm(val[i])));
    return false;
  }
  function solvePuzzle(id) {
    const p = D.puzzles[id];
    if (solved(id)) return;
    setFlag('solved_' + id);
    act(p.onSolve);
    sfx('ok');
    dirty();
  }

    { id: "c1_tihui", path: "C:/我的文档/竞赛/复赛题目回忆.txt", type: "txt", date: "1999-05-19 22:40", requires: "ch1",
      text: "复赛题目回忆（上机，5.17 晚 19:00—22:00）\n\n1. 校门口的梧桐树（贪心）—— 给 N 棵树的位置，用最少的绳子围起来。30 分钟写完。\n2. 机器人搬砖（BFS）—— 地图 50×50，注意边界。写了 1 个小时，最后 10 分钟才过样例。\n3. 字符串压缩（DP）—— 没写完。只拿了部分分。\n\n考场机器比我们机房的还旧，键盘 J 键是松的。\n交卷的时候是 21:58。\n\n回招待所的路上想，第 3 题其实是区间 DP。\n\n结果：省二等奖。离一等差 15 分。\n" },

    { id: "c1_xiaokan", path: "C:/我的文档/校刊/梧桐1999-07.doc", type: "doc", date: "1999-07-02 16:30", requires: "ch1",
      onOpen: { note: "c1_n_official" },
      html: `<h2 style="text-align:center">梧　桐</h2>
<p style="text-align:center" class="faded">梧城市第七中学校刊 · 1999 年第 4 期（7 月）· 学生排版：许嘉</p>
<hr>
<h4>■ 喜报：我校学生在全省信息学竞赛中获奖</h4>
<p>5 月 16 日至 18 日，1999 年全省青少年信息学竞赛复赛在省城举行。我校高二(2)班许嘉同学获得省二等奖，这是我校在该项赛事中取得的最好成绩。指导教师：韩立。</p>
<h4>■ 高三年级毕业典礼隆重举行</h4>
<p>6 月 30 日上午，我校 1999 届高三毕业典礼在礼堂举行。校长寄语毕业生："走得再远，也别忘了梧桐路 17 号。"</p>
<h4>■ 沉痛悼念林晚同学</h4>
<p>6 月 21 日傍晚 7 时 40 分左右，我校高二(2)班林晚同学在学校水塔顶部平台不慎坠落，经抢救无效，不幸离世，年仅十六岁。</p>
<p>经公安机关现场勘查，事故系水塔平台外侧栏杆锈蚀断裂所致，认定为意外事故。学校已于 6 月 22 日起封闭水塔，并对全校设施进行安全大检查。</p>
<p>林晚同学 1998 年 9 月转入我校，热爱文学，生前是「梧桐树下」原创文学版版主。愿她安息。</p>
<h4>■ 暑期安全提示</h4>
<p>严禁到东湖、护城河游泳；严禁攀爬水塔、围墙等高处；不进入营业性网吧、游戏厅。</p>
<p class="faded" style="text-align:right">——《梧桐》编辑部</p>` },

  T({ id: 1006, board: "diannao", title: "五笔才是最快的输入法", author: "jia", date: "1998-10-10 21:30", views: 731,
    posts: [
      P("jia", "1998-10-10 21:30", "机房装了智能ABC和五笔86。很多同学问用哪个，说一下我的看法。<br><br>1. 五笔是形码，看字形就能打，不用想读音。不会读的字也能打。<br>2. 重码少。拼音打一个 shi 要翻好几页，五笔基本不用翻页。<br>3. 熟练以后，一级简码只要按一个键加空格。<br><br>我现在每分钟 140 字左右，比手写快很多。<br>缺点：开始要背字根，大概两个星期。己经有同学在背了。<br><br>结论：想打得快，学五笔。"),

  T({ id: 1137, board: "guanshui", title: "扒一扒高二(2)班那个转学生", author: "sysop", date: "1999-05-17 21:03", ip: "192.168.1.107", views: 1311,

  T({ id: 1171, board: "xiaoyuan", title: "【转】学校关于林晚同学情况的说明", author: "xiaoyu", date: "1999-06-22 12:00", views: 1530,

  var NOTES_1231 = `12.31

21:50 进机房。门卫十点锁楼，我在里面。韩老师打过招呼。
每隔几分钟登录一次，看日志里的日期对不对。
23:30 开值守帖。
23:59:30 登录：1999-12-31。
00:00:04 登录：2000-01-01。四位年份，正常。
外面在放烟花。机房的窗户对着礼堂，看不见操场，只听得见。

00:38 发现新用户 Y2K。00:27 注册，00:31 在灌水乐园发了一帖，《第一个》。
正文两个字：归零。
以为是恶作剧。没删。
02:00 没有异常。关显示器，在机房睡了。


1.1

07:10 回家。路过操场，水塔那边拉着线，围了很多人。
十点磊磊呼我，才知道是周婷。
下午两个警察来家里。问了三件事：
1. 零点前后你在哪。——机房。
2. 有没有人能证明。——没有。只有服务器日志。
3. X 是不是你。
他们说周婷的呼机上有一条传呼，落款 X。内容没告诉我。

X 不是我。

日志是我的服务器记的。他们说，你是站长，想改就能改。
没错，我能改。所以它证明不了什么。


1.2

警察又来了一次。说大概是零点十分，从水塔平台上掉下来的。倾向意外。
千年虫的帖子，他们说是恶作剧——"第一个"大概是"2000 年第一个帖子"的意思。
不对。
1. 刘洋 00:00 就发了"2000 年第一帖"，轮不到 00:31。
2. 00:31 的时候，还没有人知道她出事。她早上 6:50 才被发现。

高一有人说，零点十几分看见一个人从水塔那边往实验楼走，没看清是谁。
那天夜里实验楼里只有我。至少我以为只有我。
警察听了这句，看我的眼神就不一样了。

Y2K 的注册 IP：192.168.1.200。校内。不是拔号。
这台机器我认得。先不写。

周婷让我去听她唱歌。我没去。


1.3

"第一个"。
第一个，就是说还有第二个。

去年六月，水塔。今年元旦，水塔。
我不信是巧合。可我现在什么证据都没有。

表哥在星光寻呼台上班。托他把那晚的寻呼记录抄一份。他说只能抄一页，不能外传。


1.4

表哥的东西拿到了：寻呼记录.txt，代码表.txt，都放在这个文件夹。
记录里十几个呼机号，哪个是她的？
问孙倩。孙倩说，婷婷的呼机号只告诉过一个人。
"她说她告诉你了啊。"
她什么时候告诉过我？
己经想了一晚上，想不起来。`;

  var PAPER_12 = `<div style="text-align:center;border-bottom:3px double #000;padding-bottom:6px"><b style="font-size:28px;letter-spacing:12px">梧 桐</b><br>梧城七中学生报　1999 年 12 月号（总第 41 期）<br><span style="font-size:12px">主办：校团委　学生编辑：宋知远　苏芮　排版：许嘉</span></div>
<h3>千禧晚会 12 月 31 日晚举行</h3>
<p>本学期最后一天，校团委将在礼堂举办“迎接新千年”千禧晚会，共十余个节目，高三(2)班周婷同学将以独唱压轴。晚会结束后，全体师生到操场参加零点倒计时。请各班注意安全，听从老师指挥。</p>
<h3>千年虫来了，怎么办？</h3>
<p style="font-size:13px">高三(2)班　许嘉</p>
<p>早年的电脑为了省地方，年份只存后两位：1999 存成 99。到 2000 年，99 加一变成 00，有的程序就以为是 1900 年。这就是“千年虫”。<br>它不是病毒，不会传染，也不会让电梯掉下来。会出问题的是那些“按年份算东西”的程序：利息、年龄、到期日、排序。<br>我校机房 12 月分批整改，具体见 BBS“电脑技术”版。家里的电脑，可以拿软盘到机房拷补丁。</p>
<h3>【便民信息】元旦起，梧城电话号码升为八位</h3>
<div class="scan" style="padding:8px;font-size:13px">
<p style="text-align:center"><b>梧城市电信局通告</b>（第 99-27 号）</p>
<p>经省邮电管理局批准，梧城本地电话网将于 <b>2000 年 1 月 1 日零时</b>起，由七位升为八位。现将有关事项通告如下：</p>
<p>一、升位方法<br>
（一）原号码首位为“2”“3”“4”的，在原号码前加“8”。例：原 231 5678，新 8231 5678。<br>
（二）原号码首位为“5”“6”的，在原号码前加“6”。例：原 562 0011，新 6562 0011。<br>
（三）原号码首位为“7”“8”的（东湖区、梧城开发区），在原号码前加“2”。例：原 712 3456，新 2712 3456。<br>
（四）城西分局所辖 340 至 349 局号（新华路、梧桐路、学府街一带），已于 1999 年 11 月割接至新城西端局，<b>不按第（一）条办理</b>，一律在原号码前加“6”。例：原 342 1100，新 6342 1100。</p>
<p>二、特服号码（110、119、120、122、112、114 等）及无线寻呼台号码不变。</p>
<p>三、公用电话（含 IC 卡电话、投币电话）同步升位，规则同上。</p>
<p>四、2000 年 1 月 1 日至 3 月 31 日为过渡期，拨打旧号码时将听到改号提示。新号码可查阅《梧城 2000 年电话号码簿》（营业厅有售，另有光盘版）。</p>
<p style="text-align:right">梧城市电信局　1999 年 12 月 10 日</p>
</div>
<p>（本校总机由 345 1688 改为 6345 1688，其余号码见号码簿。）</p>
<h3>高考倒计时：206 天</h3>
<p>高三年级期末考试定于 1 月 17 日开始。寒假补课 2 月 10 日开始，具体安排另行通知。</p>`;

  var PAPER_01 = `<div style="text-align:center;border-bottom:3px double #000;padding-bottom:6px"><b style="font-size:28px;letter-spacing:12px">梧 桐</b><br>梧城七中学生报　2000 年 1 月号（总第 42 期）<br><span style="font-size:12px">主办：校团委　学生编辑：宋知远　苏芮　排版：许嘉</span></div>
<p style="font-size:12px;text-align:center">本期封面：千禧夜，高三(2)班在操场合影（摄影：高一(3)班　校摄影小组）</p>
<h3>你好，2000！——我校千禧晚会圆满落幕</h3>
<p>12 月 31 日晚 7 时，“迎接新千年”千禧晚会在学校礼堂拉开帷幕。开场舞《千禧之光》热情洋溢，高二(1)班的相声《我和千年虫》把“千年虫”演成了一只怕冷的小虫子，台下笑声不断。高三(2)班的小品《高考倒计时》引起了高三同学的强烈共鸣。</p>
<p>晚会由高三(2)班苏芮和高二(1)班程一帆主持。压轴节目是高三(2)班周婷同学的独唱《等你到零点》，歌声清亮，全场掌声经久不息。</p>
<p>23 时 30 分，晚会结束，全校师生来到操场。顾秋白老师主持零点倒计时。“十、九、八……”伴着操场大钟的钟声，2000 年到来了。烟花升起，同学们相互拥抱，许下新年愿望。</p>
<h3>机房和服务器平稳跨年</h3>
<p>据计算机教研组介绍，经过 12 月的整改，我校机房和 BBS 服务器在零点平稳跨入 2000 年，未发现异常。</p>
<p class="faded" style="font-size:12px">又讯：元旦凌晨，我校一名高三女生在校内发生意外，不幸离世。学校对此深表哀痛，已加强校园安全管理。请同学们不要进入水塔等危险区域。</p>
<h3>期末考试安排</h3>
<p>高三年级 1 月 17 日至 19 日，高一、高二年级 1 月 19 日至 21 日。</p>`;

        { id: 1428, board: "guanshui", title: "千年虫到底是个什么虫？能吃吗", author: "leilei", date: "1999-10-14 20:00", views: 356, requires: "ch2",

      html: `<div style="font-family:KaiTi,STKaiti,serif;max-width:460px;margin:20px auto;border:3px double #c03;padding:18px 22px;background:#fff6f6;">
<div style="font-family:SimSun,serif;font-size:12px;color:#888;">梧桐树下 · 电子贺卡　　From：远方(yuanfang)　To：小芮(xiaorui)　2000-02-14 16:42</div>
<div style="font-size:22px;color:#c03;text-align:center;margin:12px 0 14px;">给你</div>
<div style="font-size:17px;line-height:1.95;letter-spacing:1px;">
千禧年的第一场雪<br>
新年的钟声敲过以后<br>
连飞虫都躲进了墙缝<br>
我一直知道你在等春天<br>
冬天的街道很长很安静<br>
我总觉得这是最好的冬天<br>
原谅去年春天我说过的话<br>
记得柳树下的我们吗<br>
冰面上并排站着的三个人<br>
我一直想要告诉你一个秘密<br>
可是我比你想象的要胆小得多<br>
天黑以后路上你一定要小心</div>
<div style="font-size:14px;color:#555;margin-top:14px;line-height:1.7;">P.S. 第一行的第一个字，第二行的第二个字……<br>我说的每一句话，都比上一句更往后退一步。</div>
<div style="font-size:14px;text-align:right;margin-top:8px;">——远方</div></div>` },

        posts: [
          { author: "majun", date: "2000-01-16 15:05", html: "我昨晚在家给磊磊发了封站内信，今天他说收到的信时间是 1980-01-01 01:07。<br>啥情况？站内信穿越了？" },

          { author: "jia", date: "2000-01-16 21:50", html: "站内信的发信时间取的是你自己电脑的时钟，不是服务器的。<br>你家电脑开机时间是不是回到了 1980 年？那是主板上的 CMOS 电池没电了，换一颗纽扣电池就好。<br>列表是按发信时间排的，所以你的信排到最底下去了。<br>登录日志用的是服务器时间，不受影响。<br>这个问题下个版本改。" },
          { author: "majun", date: "2000-01-16 22:03", html: "开机一看还真是 1980……站长牛。" },
          { author: "liuyang", date: "2000-01-16 22:30", html: "那我把电脑时间调成 2008 年，是不是我的信就永远排在第一个？" },
          { author: "jia", date: "2000-01-16 22:41", html: "是。别这么干。" },
        ] },

      { id: 1617, board: "wenxue", title: "原创文学版好久没人发东西了", author: "xiaoyu", date: "2000-01-22 21:40", views: 64, requires: "ch3",
        posts: [
          { author: "xiaoyu", date: "2000-01-22 21:40", html: "随便写一段，算是给这个版除除草。<br><br>《雪》<br>早上推开窗，楼下的自行车都戴上了白帽子。<br>我想起数学老师说，雪花是六角形的，因为水分子的夹角是一百零四度半。<br>可我还是更喜欢不知道答案的时候。" },
          { author: "qingman", date: "2000-01-22 22:15", html: "她以前每天都会来这里。" },
          { author: "jia", date: "2000-01-22 22:31", html: "原创文学版的版主不撤。" },
          { author: "xiaoyu", date: "2000-01-22 22:40", html: "嗯。我们都记得。" },
        ] },

      { id: 1620, board: "zhanwu", title: "寒假期间 BBS 服务说明", author: "sysop", date: "2000-01-25 10:05", ip: "192.168.1.103", views: 120, requires: "ch3",
        posts: [
          { author: "sysop", date: "2000-01-25 10:05", html: "1. 寒假期间服务器（机房 3 号机）照常运行，请勿到机房乱动服务器。<br>2. 校外同学请通过梧城信息港拨号访问。<br>3. 站长每周二、周五到校维护，有问题请发站内信给 sysop 或 jia。<br>4. 情人节前会上线一个新功能，敬请期待。" },
        ] },

      { id: 1622, board: "diannao", title: "新功能：电子贺卡（情人节用）", author: "jia", date: "2000-01-28 23:02", ip: "192.168.1.103", views: 302, requires: "ch3",

      { id: 1631, board: "guanshui", title: "千年虫还会出来吗？", author: "liuyang", date: "2000-02-08 22:15", views: 335, requires: "ch3",

      { id: 1634, board: "xiaoyuan", title: "【置顶】高三下学期补课课表", author: "xiaoyu", date: "2000-02-10 07:20", ip: "192.168.1.150", views: 290, sticky: true, requires: "ch3",
        posts: [
          { author: "xiaoyu", date: "2000-02-10 07:20", html: "2 月 10 日起补课，周一至周六。<br>上午 7:40—11:50，四节；下午 14:00—16:30，三节；<br>晚自习 18:40—21:30（周日休息）。<br>周一、周三晚自习可以去微机室上机查资料，要登记。<br>数学两套卷子周五前交班长。" },

      { id: 1640, board: "xiaoyuan", title: "关于高三下学期班级纪律的几点意见", author: "yuanfang", date: "2000-02-13 15:22", ip: "61.153.51.92", views: 172, requires: "ch3",
        posts: [
          { author: "yuanfang", date: "2000-02-13 15:22", html: "距离高考只有 145 天。作为班长，提几点意见，请大家认真对待：<br>一、晚自习不得讲话、传纸条。有问题课后问。<br>二、作业按时上交。上周数学卷子我们班是全年级最后一个交齐的，这很丢人。<br>三、BBS 灌水请适度。高三下学期，时间比什么都贵。<br>四、晚自习后请尽量结伴回家。<br>以上，望共勉。——宋知远" },
          { author: "leilei", date: "2000-02-13 15:40", html: "班长威武。第三条我看见了，我假装没看见。" },
          { author: "liuyang", date: "2000-02-13 16:05", html: "第三条能不能删" },
          { author: "xiaoyu", date: "2000-02-13 16:30", html: "支持班长。卷子我周五一定交齐。" },
          { author: "zhaopeng", date: "2000-02-13 18:10", html: "第四条我赞成，男生可以送女生。" },
        ] },

      { id: 1645, board: "xiaoyuan", title: "班长", author: "xiaoyu", date: "2000-02-15 08:30", ip: "192.168.1.150", views: 512, requires: "ch3",
        posts: [
          { author: "xiaoyu", date: "2000-02-15 08:30", html: "今天早上顾老师在班里说了班长的事。<br>昨天下午他还站在讲台上收数学卷子，说我们班交得最慢。<br>他的座位还空着，卷子还在他桌上，一张一张码得很整齐。<br>我不知道该说什么。<br>班长，你不用再考第一了。" },
          { author: "zhaopeng", date: "2000-02-15 09:02", html: "班长，一路走好。" },
          { author: "leilei", date: "2000-02-15 09:20", html: "他昨天还骂我作业抄得太明显……" },
          { author: "sunqian", date: "2000-02-15 10:15", html: "报纸上会说是意外吧。又是意外。" },
          { author: "xiaorui", date: "2000-02-15 21:40", html: "……" },
        ] },

      { id: 1647, board: "guanshui", title: "千年虫是谁，大家心里没数吗？", author: "majun", date: "2000-02-15 13:10", ip: "192.168.1.122", views: 877, requires: "ch3",
        posts: [
          { author: "majun", date: "2000-02-15 13:10", html: "我就问几个问题：<br>1. 千年虫的帖子都是从校内网发的。谁天天待在机房？<br>2. 谁有站长权限，想发什么发什么，想删什么删什么？<br>3. 元旦那天晚上，全校都在操场，谁一个人在机房？<br>4. 去年那个扒人的帖子，是用谁的账号发的？<br>我不点名。大家自己想。" },
          { author: "leilei", date: "2000-02-15 13:22", html: "马俊你别瞎说！！" },
          { author: "liuyang", date: "2000-02-15 13:40", html: "……说的也不是没道理。" },
          { author: "xiaoyu", date: "2000-02-15 14:05", html: "警察会查的，不要在这里乱猜。" },
          { author: "sunqian", date: "2000-02-15 14:30", html: "婷婷那天晚上收到的传呼，署名是“X”。" },
          { author: "leilei", date: "2000-02-15 14:51", html: "署名 X 就是许嘉？那我署名 L 就是林……算了。我不说了。" },
        ] },

      { id: 1649, board: "zhanwu", title: "关于千年虫，我只说一次", author: "jia", date: "2000-02-16 07:15", ip: "192.168.1.103", views: 1033, sticky: true, requires: "ch3",
        posts: [
          { author: "jia", date: "2000-02-16 07:15", html: "我不是千年虫。我知道说这句话没什么用。<br>两次的服务器日志，我己经全部交给警察了。<br>如果你收到署名“千年虫”的站内信，或者有人约你晚上单独出去——不要去。告诉老师，或者报警。也可以告诉我。<br>晚上别一个人走。<br>这个帖子不开回复。" },
        ] },

      { id: 1652, board: "xiaoyuan", title: "【转】教导处通知：晚自习后请结伴回家", author: "xiaoyu", date: "2000-02-17 12:10", ip: "192.168.1.150", views: 344, requires: "ch3",
        posts: [
          { author: "xiaoyu", date: "2000-02-17 12:10", html: "教导处通知：<br>近期气温回升，东湖冰面开始融化，严禁学生上冰。<br>晚自习放学后请同学们结伴回家，不要在外单独逗留。<br>如收到陌生人或可疑的约见信息，请及时报告班主任。<br>——学习委员 陈小雨 转" },

  // 鸽讯：都发生在 3 号机上（服务器常年开机，许嘉的鸽讯一直挂着；他回机房时才回话）
  gexun: {
    logs: [
      { id: "c3_gx_0109_leilei", contact: "leilei", date: "2000-01-09", requires: "ch3",
        lines: [
          { who: "them", time: "21:30:02", text: "嘉！！期末考完了没！" },
          { who: "me", time: "21:30:40", text: "明天最后一门" },
          { who: "them", time: "21:31:05", text: "考完去千禧网吧通宵！刘洋包了3号间" },
          { who: "me", time: "21:31:30", text: "不去。服务器要备份" },
          { who: "them", time: "21:31:50", text: "你跟服务器过一辈子吧 T_T" },
          { who: "them", time: "21:32:20", text: "对了，灌水乐园有人发广告，卖什么“千年虫防护卡”，一张五十，你删一下" },
          { who: "me", time: "21:33:01", text: "删了" },
          { who: "them", time: "21:33:15", text: "效率！！" },
        ] },

      { id: "c3_gx_0121_hanli", contact: "hanli", date: "2000-01-21", requires: "ch3",
        lines: [
          { who: "them", time: "10:15:20", text: "许嘉，寒假服务器你看着点。" },
          { who: "me", time: "10:16:02", text: "好的韩老师。每周二、五我来。" },
          { who: "them", time: "10:17:05", text: "元旦那件事，警察还找过你吗？" },
          { who: "me", time: "10:17:30", text: "没有了。" },
          { who: "them", time: "10:18:10", text: "嗯。有什么事先跟我说。" },
          { who: "them", time: "10:18:30", text: "别一个人扛着。" },
          { who: "me", time: "10:18:55", text: "知道了。谢谢韩老师。" },
        ] },

      { id: "c3_gx_0124_yuanfang", contact: "yuanfang", date: "2000-01-24", requires: "ch3",
        lines: [
          { who: "them", time: "20:05:11", text: "许嘉，帮个忙。" },
          { who: "them", time: "20:05:30", text: "补课的课表学校刚发下来，你在BBS上帮我置顶一下。" },
          { who: "me", time: "20:06:02", text: "你让陈小雨发吧。她是学委。" },
          { who: "them", time: "20:06:45", text: "她发的没人看。你是站长，你发的大家才当回事。" },
          { who: "them", time: "20:07:03", text: "这种事情你做起来比我快。就这样。" },
          { who: "me", time: "20:07:40", text: "她发，我给她置顶。" },
          { who: "them", time: "20:08:12", text: "……也行。" },
          { who: "them", time: "20:08:51", text: "对了，你那个五笔，有空教我一下。拼音确实太慢。" },
          { who: "me", time: "20:09:10", text: "先背字根。" },
          { who: "them", time: "20:09:30", text: "算了。" },
        ] },

      { id: "c3_gx_0202_xiaorui", contact: "xiaorui", date: "2000-02-02", requires: "ch3",
        lines: [
          { who: "them", time: "15:20:11", text: "许嘉！！在吗！！" },
          { who: "me", time: "15:21:00", text: "在" },
          { who: "them", time: "15:21:20", text: "校园生活版有人发了好几条卖复读机的广告！！我删不掉！！是不是我版主权限出问题了？！" },
          { who: "me", time: "15:22:40", text: "他发在回复里。版主只能删主帖。我删了。" },
          { who: "them", time: "15:23:05", text: "谢谢站长！！你真是太靠谱了！！" },
          { who: "them", time: "15:23:30", text: "对了，开学第一天广播站要做“新学期新气象”特别节目，你有没有什么好听的纯音乐？要没有歌词的那种！" },
          { who: "me", time: "15:24:10", text: "没有。问磊磊" },
          { who: "them", time: "15:24:25", text: "……好吧！！" },
        ] },

      { id: "c3_gx_0208_leilei", contact: "leilei", date: "2000-02-08", requires: "ch3",
        lines: [
          { who: "them", time: "15:02:31", text: "嘉！！你终于上线了！！我初一零点给你发的拜年你现在才看见吧！！" },
          { who: "me", time: "15:03:12", text: "刚到机房。新年好" },
          { who: "them", time: "15:03:30", text: "大年初四你去机房？？" },
          { who: "me", time: "15:03:51", text: "服务器得看着" },
          { who: "them", time: "15:04:10", text: "你家服务器是你亲儿子吧" },
          { who: "them", time: "15:04:40", text: "今年一定要考上啊！我们说好了一起去省城的" },
          { who: "me", time: "15:05:02", text: "你也是。少灌水" },
          { who: "them", time: "15:05:15", text: "做不到 ^_^" },
        ] },

      // ★ 损坏会话（GXREPAIR 修复后出现）：宋知远的坦白
      { id: "c3_gx_0213", contact: "yuanfang", date: "2000-02-13", requires: "ch3 & solved_c3_p_repair",
        lines: [
          { who: "them", time: "23:10:42", text: "在吗" },
          { who: "them", time: "23:10:58", text: "许嘉，我是宋知远。" },
          { who: "me", time: "23:11:31", text: "在。" },
          { who: "them", time: "23:11:50", text: "你还在机房？" },
          { who: "me", time: "23:12:08", text: "嗯。周日晚上整理数据库。门卫知道。" },
          { who: "them", time: "23:12:40", text: "有件事，我想了一天一夜，觉得只能跟你说。" },
          { who: "them", time: "23:13:02", text: "你先答应我，今天说的话，不要告诉任何人。" },
          { who: "me", time: "23:13:30", text: "你先说。" },
          { who: "them", time: "23:14:15", text: "我收到千年虫的站内信了。" },
          { who: "them", time: "23:14:22", text: "“第二个是你。”" },
          { who: "me", time: "23:14:50", text: "什么时候" },

    { id: "c4_wav0317", path: "C:/Program Files/WTBBS/DATA/broadcast/20000317.wav", type: "audio", date: "2000-03-17 07:15", size: "10,982 KB", requires: "ch4",

    // ================= 许嘉的调查笔记（2000-03 下旬） =================
    { id: "c4_note0321", path: "C:/我的文档/调查/3.21.txt", type: "txt", date: "2000-03-21 23:40", requires: "ch4",
      text: `3.21

早上七点，喇叭响了。

先是一段很低、很慢的声音，像隔着水。然后是林晚。是她高二那年给广播站录的那首诗，我听过。

第二节课的时侯，全校都知道了：苏芮在广播站。李静六点五十去开门发现的。

昨晚她在机房跟我说，有个“也收到信的人”约她去广播站一起想办法。我问是谁，她不说。
我应该跟着去的。

昨晚十点二十我在家拔号上去看过一眼，什么都没有。
《第三个》是 22:31 发的。又是 .200。

录音我留着了（broadcast 目录，record.log 里有记录）。
前面那段是放慢的，正常速度听不清。
校长室说录音要下线，不许外传。` },

    { id: "c4_note0324", path: "C:/我的文档/调查/3.24.txt", type: "txt", date: "2000-03-24 22:05", requires: "ch4",
      text: `3.24

三封站内信，三个 1900。三个帖子，都从 .200。
把整改清单（详细版）又翻出来对了一遍。全校没打补丁的，只有那一台。

韩老师。

不可能。他是 BBS 的指导老师，这个站是他帮我向学校申请下来的。

可是那台机器平时只有他用。
23 号我在鸽讯上问他，他让我别管，说他来处理。` },

    { id: "c4_note0327", path: "C:/我的文档/调查/3.27.txt", type: "txt", date: "2000-03-27 21:30", requires: "ch4",
      text: `3.27

实验楼晚上十点锁大门。22:31 还在二楼教研室里的人，手里一定有钥匙。

中午去门卫室借了钥匙登记表，说是机房要核对，在图书馆扫了一份（钥匙登记表.jpg）。
第三行被人撕掉了，只剩一个序号。问门卫，说不知道，表一直挂在墙上，谁都碰得到。

下午第二节韩老师在初二上课，教研室门没锁，486 还开着。
他说要“处理”那台机器。我得在他处理之前看看里面有什么。

拷了一张软盘：成绩库、几份教案，还有一个加了密码的文档。东西放在 调查/JYS486。
软盘只有 1.44M，拷不全。
用的 copy，文件的修改时间没变，还是 486 自己的时钟——2000 年以后的，年份全是 1900。

那个文档的密码提示是“晚晚”。
试了 wanfeng、linwan，不对。韩老师的密码一般是数字。` },

    { id: "c4_note0330", path: "C:/我的文档/调查/3.30.txt", type: "txt", date: "2000-03-30 23:55", requires: "ch4",
      text: `3.30

登记表那个文件，密码试出来了。
又把她去年给校刊写的那篇作文翻出来看了一遍。

我在机房坐了很久。

如果是真的，那他就有理由。
周婷、宋知远、苏芮。他们三个害死了她。

可是不对。
他要是千年虫，为什么偏偏用自己那台机器？全校只有那一台会把时间变成 1900。他不笨，他是教电脑的。

还差一点。` },

      text: `韩老师：

我知道 192.168.1.200 是您的机器。
我也知道林晚的事了。

我不相信是您。
可是如果不是您，那就是一个能进教研室、能用那台机器的人。

您能不能告诉我` },

    { id: "c4_jys_ja4", path: "C:/我的文档/调查/JYS486/教案/2000春/第四周 局域网基础.doc", type: "doc", date: "1900-03-20 16:52", requires: "ch4",
      props: { "作者": "韩立" },
      html: `<p><b>高二信息技术　第四周　局域网基础</b></p>
<p>教学目标：了解局域网的组成；认识 IP 地址；会用“网上邻居”。</p>
<p>重点：IP 地址的写法。举例：本校微机室 192.168.1.101 至 192.168.1.140，一台机器一个号，不能重复。</p>
<p>难点：服务器和客户机的关系。可以用机房 3 号机（BBS 服务器）做例子。</p>
<p>课后：上机练习，“网上邻居”里找到老师机，把作业文件拷进去。</p>
<p style="color:#777">（备注：初二借用机房，周四第三节。提前通知许嘉别关服务器。）</p>` },
    { id: "c4_jys_ja3", path: "C:/我的文档/调查/JYS486/教案/2000春/第三周 文件管理.doc", type: "doc", date: "1900-03-13 17:05", requires: "ch4",
      props: { "作者": "韩立" },
      html: `<p><b>高二信息技术　第三周　文件管理</b></p>
<p>教学目标：会新建、复制、移动、删除文件；知道“回收站”里的文件还能还原。</p>
<p>强调：删除不等于没有了。文件的修改时间、属性都会留下来。</p>
<p>课堂提问：一个文件的“修改时间”是谁决定的？（答：保存它的那台电脑的时钟。）</p>` },

    { id: "c4_essay", path: "C:/我的文档/校刊/我的爸爸.doc", type: "doc", date: "1999-04-12 21:30", requires: "ch4",
      props: { "作者": "林晚（许嘉录入）", "备注": "春季号来稿。林晚后来说不登了，原稿还给了她。原稿背面有铅笔字，我也录了一份，设成隐藏了。" },
      html: `<h3 style="text-align:center">我的爸爸</h3>
<p style="text-align:center;font-size:12px">高二（2）班　林晚</p>
<p style="text-indent:2em">我的爸爸是一个话很少的人。</p>
<p style="text-indent:2em">我一岁多的时候，他和妈妈就分开了。我跟妈妈姓，在南方一座小城长大。小时候我问妈妈，爸爸是什么样子的？妈妈想了很久，说：他是一个会修东西的人。</p>
<p style="text-indent:2em">去年春天，妈妈走了。舅舅带我坐了一天一夜的火车，来到这座北方的城市。后来我才知道，舅舅选这里，是因为爸爸在这里。</p>
<p style="text-indent:2em">我记得的第一次见面，是在一间放满旧电脑的屋子里。他蹲在地上修一台机器，抬头看见我，螺丝刀掉在了地上。那天他教我打字，屏幕是黑的，字是绿的。我打的第一句话是“你好”，他看了很久，在下面也打了两个字：“你好。”</p>
<p style="text-indent:2em">现在我每天都能见到他。他站在讲台上的时候，我坐在下面，和别人一样叫他老师。</p>
<p style="text-indent:2em">每个星期五放学，他把那辆旧的蓝色小车停在西门外的路口，等我走过去，送我回舅舅家。路上有十二个红绿灯。我们一般只说三四句话，大多是他问我冷不冷。</p>
<p style="text-indent:2em">十月三日是我的生日。他记得。他送了我一盒彩色铅笔，二十四色的，和我七岁那年妈妈说是他寄来的那盒一模一样。</p>
<p style="text-indent:2em">现在还不能告诉别人他是我爸爸。他说现在还不行。</p>
<p style="text-indent:2em">我不着急。我已经等了十几年了，我很会等。</p>` },

    // poem10：作文原稿背面（隐藏文件）
    { id: "c4_essay_back", path: "C:/我的文档/校刊/我的爸爸（原稿背面）.txt", type: "txt", date: "1999-04-12 21:52", hidden: true, requires: "ch4",
      onOpen: { collect: "poem10" },
      text: `（作文纸背面，铅笔写的，字很淡，有两处涂改）

修电脑的人

他把机箱打开
像打开一只很旧的钟
里面落满了灰
他说别怕　都是能修好的
我站在旁边递螺丝
一颗　两颗
没有人知道
这是我们一个星期里
最长的一次说话` },
  ],

<p>11月1日零点，梧桐路17号旧校区的拆除按计划开始。老水塔第一个倒下。有人在操场边举着手机拍下了那一刻：砖塌下去，扬起一大片灰。本地新闻用了十五秒，标题叫《一个时代的落幕》。</p>
<p>第三天，一篇《千禧年七中连环命案，真凶另有其人》开始在网上流传。文章没有署名，推理一步一步，和你推理板上的一模一样。去世七年的计算机老师韩立被顶上了热搜，评论区有人翻出了他的墓地在哪个公墓。</p>
<p>“许嘉沉冤得雪”被转发了十几万次。七中的官方账号沉默了三天，然后发了一份声明，落款是教导处。</p>
<p>你没有发视频。3 号机被你装回纸箱，塞在工作台底下。偶尔夜里你会想起那个被放慢的声音：第三个。归零。</p>

      text: `3.25 夜

千年虫第三个帖子（3.20 22:31）：
「第三个。不会在有人说谎了。」

"不会在有人说谎了"——应该是"再"。
这是同音错字。五笔里"再"和"在"的编码完全不像，用五笔不可能把这两个字打混。
只有拼音会出这种错：zai 一敲，候选第一个是"在"，手快就上去了。

五笔的错是另一种：拆字的时候按错一个键，出来的是长得像的字。
比如我自己老打"己经""末来""拔号"。看着像，读音不一样。

所以千年虫用拼音。
我把站上常发帖的人统计了一下（看他们帖子里的错字，加上平时在机房看到的）：

jia         五笔86          形近（己/已 末/未 拔/拨）     我自己
hanli       五笔86          形近，很少                   韩老师
majun       五笔            形近（未/末）                跟我学的

      onOpen: { note: "c5_n_hanli" },
      text: `4.1

昨天把给韩老师的信删了。今天下午直接去教研室找他。
我问他林晚是不是他女儿。他没说话，过了很久点了一下头。
他从抽屉里拿出一个本子，是林晚的日记，让我替他收着。他说他放在身边，每天都想烧掉，又舍不得。

千禧夜他跟我爸在教育局值班。回家问了我爸，一整夜两个人都在，早上六点才换班。
不是他。

那就是一个能进教研室、又知道林晚密码的人。

2.14 晚上 19:52，有人用 wanfeng 从那台 486 登录，给宋知远发了站内信。
WTBBS 1.2 的时候用户密码是明文存的（蠢）。去年 10 月改成了加密，
但是 DATA 下面那个旧的 USER.BAK 我一直没删，设成了隐藏。

今天打开看了。wanfeng 那一行：820916。
不是林晚的生日，她是 10 月 3 号。
82 年 9 月 16 日。

日记里有一页写到了密码，我扫了下来，放在照片目录里。

我知道这是谁的生日。
不想写下来。` },

      text: `4.2

上面的名字，和 820916 是同一个人。

我没把它还回去。夹在物理作业本里了。
我想在别人看到之前，先跟她谈一次。

把去年 12 月的东西又翻了一遍。

那段聊天我没删。鸽讯里删掉了也没关系，GXBAK 会多存一份，备份目录是隐藏的。` },

      { id: 1806, board: "diannao", title: "再说一次：错别字是有“指纹”的（五笔 vs 拼音）", author: "jia", date: "2000-04-02 22:30", views: 211, requires: "ch5",
        onOpen: { note: "c5_n_fingerprint" },
        posts: [
          { author: "jia", date: "2000-04-02 22:30", html: "之前那个五笔拼音的帖子吵了两百楼，没吵出结果。我换个角度说。<br><br>一个人怎么打错字，跟他用什么输入法有关。<br><br><b>拼音：音对，字错。</b>打 zai，候选第一个是“在”，手快就上去了。所以拼音用户写错的都是<b>同音字</b>：在/再、的/得、做/作、象/像、以/已。<br><br><b>五笔：码对一半，字错。</b>五笔按字形拆，按错一个键，出来的是<b>长得像的字</b>：己/已、末/未、拔/拨、折/析。读音可以完全不一样。<br><br>所以只看一个人写错的字，就能大概知道他用什么输入法。五笔用户几乎不可能把“再”打成“在”，这两个字五笔编码一点都不像；拼音用户也几乎不可能把“已经”打成“己经”，因为拼音里“yijing”只会出来“已经”。<br><br>我自己就老打“己经”，你们早发现了吧。<br>这就是指纹。" },
          { author: "leilei", date: "2000-04-02 22:41", html: "智能ABC 天下第一，同音字是我的信仰" },
          { author: "liuyang", date: "2000-04-02 22:50", html: "所以我那/哪不分，是因为输入法？不是因为语文不好？太好了" },
          { author: "majun", date: "2000-04-02 23:02", html: "站长，我五笔是你教的，我也老是未末不分……" },
          { author: "jia", date: "2000-04-02 23:05", html: "那是你没练。" },
        ] },

  dialogues: [
    // ---------------- 何蔓 ----------------
    { id: "c5_d_heman1", contact: "heman", trigger: "ch5",
      steps: [
        { npc: "早，{player}师傅。" },
        { npc: "昨天……谢谢你没有就那样结束。我其实一夜没睡。" },
        { npc: "你说恢复到 97% 了？剩下的那些，会不会就是最要紧的？" },
        { me: "有可能。今天恢复出来不少许嘉三四月的东西，还有他去世那天晚上的。" },
        { npc: "那天晚上……" },
        { delay: 1500 },
        { npc: "{player}师傅，我想拜托你一件事。你看的时候，留意一下有没有加密的文件，或者打不开的压缩包。" },
        { npc: "许嘉那种人，真有什么要紧的东西，一定会锁起来。" },

        { npc: "还有，这几天先别跟别人说这台电脑的事，好吗？学校这边……很敏感。" },
        { npc: "我先去开会了。有发现随时告诉我，在联系。" },

    { id: "c5_d_heman2", contact: "heman", trigger: "ch5 & seen_c5_f_letter",
      steps: [
        { npc: "{player}师傅，今天恢复出来的东西里，有那封遗书吗？" },
        { me: "有。《对不起.doc》，4 月 4 日晚上 22:47 存的。" },
        { npc: "当年警察说他留了遗书，说他承认了。我们谁都没见过原文。" },
        { npc: "上面……写了什么？" },
        { choice: [

    { id: "c5_d_heman3", contact: "heman", trigger: "ch5 & c5_got_keyhalf & dlg_c5_d_xuning2",
      steps: [

        { npc: "我那时候电脑一窍不通，现在也就会用用办公软件。" },
        { sys: "（你想起许宁刚发来的那半张纸。）" },
        { puzzle: "c5_p_lie1" },
        { me: "何老师，您当年是计算机课代表。教研室的钥匙，您也有一把。" },

        { choice: [

    { id: "c5_d_heman4", contact: "heman", trigger: "ch5 & solved_c5_p_typist",

        { npc: "那年我十岁。清明那天下午，他从陵园回来，在门口换鞋，跟我妈说晚上不回来吃饭了，要跟一个朋友谈谈。" },

    { id: "c5_d_xuning2", contact: "xuning", trigger: "ch5 & seen_c5_f_n0402 & dlg_c5_d_xuning1",

  items2026: [
    { id: "c5_it_report", name: "警方《情况说明》复印件", requires: "c5_got_report",
      onOpen: { note: "c5_n_report" },
      html: `<div class="scan" style="line-height:1.9;font-size:14px">
<div style="text-align:center;font-size:18px;font-weight:bold;letter-spacing:4px">梧城市公安局</div>
<div style="text-align:center">情 况 说 明</div>
<div style="text-align:center;font-size:12px">（内部材料　注意保存）</div>
<p style="text-align:center"><b>关于梧城市第七中学系列学生死亡事件的情况说明</b></p>
<p>1999年12月31日至2000年4月4日，我市第七中学高三（2）班先后有四名学生死亡。现将有关情况说明如下：</p>
<p>一、周婷（女，17岁）。2000年1月1日6时50分被校工发现于校内水塔下，系高处坠落死亡。</p>
<p>二、宋知远（男，17岁）。2000年2月15日晨被发现于东湖公园冰面冰窟内，系溺水死亡。</p>
<p>三、苏芮（女，17岁）。2000年3月21日6时50分被发现于行政楼五楼广播站内，系窒息死亡。当日7时，广播站播放机定时开播，播出一段经变速处理的录音。<span style="text-decoration:underline;text-decoration-color:#2b4c9a">播放机内磁带标签手写\u201c晚风\u201d二字（该细节未对外公布）。</span></p>
<p>四、许嘉（男，18岁）。2000年4月5日7时10分由该校教师韩立发现于实验楼三楼微机室3号计算机前。经法医检验，系过量服用安眠类药物死亡，死亡时间推定为4月4日22时至24时，体表无外伤。桌上有一次性奶茶杯一只，残留物检出同类药物成分；药物来源未查明（死者家中无此类药物）。3号计算机处于开机状态，遗书系在3号机写字板中打出，文件名《对不起.doc》，内容为承认以上三起事件系其所为，落款\u201c许嘉\u201d。</p>
<p>五、经调查，校内BBS\u201c梧桐树下\u201d上署名\u201c千年虫\u201d的帖子与上述事件存在对应关系。许嘉系该BBS管理员，具备相应技术条件。结合遗书内容，认定上述事件系许嘉所为，许嘉畏罪自杀。</p>
<p style="font-size:13px">附：实验楼门卫张某证言摘要——4月4日20时30分许，一名女生自称计算机课代表，称给机房送作业软盘，手中拎两杯奶茶，登记后上楼，未见其离开。22时按时锁楼，见三楼微机室灯亮，因许嘉下午曾告知\u201c通宵备份服务器\u201d，未上楼查看。<span class="faded">该女生身份未能核实。</span></p>
<p style="text-align:right">本案于2000年4月12日结案。</p>
<p style="text-align:right"><span class="stamp">梧城市公安局七里河分局</span></p>
<p class="hand" style="color:#2b4c9a;font-size:13px">（页边，蓝色圆珠笔）两杯？</p>
</div>` },

      text: `给看到这些的人

如果你在看这个，说明今晚谈得不好。或者说明我爸把那串数字想明白了。
爸，如果是你，对不起，让你费脑子了。

我叫许嘉，高三(2)班，梧桐树下的站长。下面这些事，我按顺序写清楚。

1. 千年虫发给我的站内信，日期是 1900 年。WTBBS 的站内信时间取的是发信人电脑的时钟，这是我自己留的 bug，一直没改。全校的机器千年虫补丁都是我打的，只有教研室那台 486 没动。所以千年虫用的是那台机器。

2. 我一开始以为是韩老师。可是千禧夜韩老师和我爸在教育局值班，一整夜。我爸不会记错。

3. 能进教研室的，钥匙登记表上只有三个人：韩老师、顾老师、计算机课代表。

4. 2 月 14 号晚上，有人用 wanfeng 登录，约宋知远去了东湖。林晚的密码是 820916。我查了同学录，那是何蔓的生日。林晚在日记里写过，她的密码是她最好的朋友的生日。

5. 千年虫第三个帖子里写"不会在有人说谎了"。在和再，只有拼音才会打混。我认识的人里，只有一个人永远把"再"打成"在"。

6. 去年 12 月 25 号晚上，我把苏芮、宋知远、周婷三个名字告诉了她。只告诉了她。六天以后周婷就死了。

所以是何蔓。是我让她知道的。

我没有报警。不是不敢。
她是林晚唯一的朋友。她做这些，是因为她以为林晚是被那个帖子逼死的。
我想让她自己去说。自首和被抓不一样，对她不一样，对林晚也不一样。

林晚不是自杀。
韩老师是她爸爸，学校里没人知道。上个月韩老师把她的日记交给我保管。日记的最后一页是去年 6 月 20 号写的。她在等一件事，等第二天。她不是要走，她是在等。
韩老师说，那天他本来都准备好了。他没来得及。
水塔上的栏杆是锈断的。

今晚我会把这些告诉何蔓。我想她听完会明白。

如果她不明白：
今天下午五点半之前，我会把东西放进水塔第七级铁梯下面的检修口。那块铁板是松的，往上一推就开。
里面是一个铁皮饼干盒：
- 林晚的日记
- 去年 5 月 17 日晚自习的机房上机登记表，原件
- 一张软盘，服务器 1999 年 5 月到现在的全部日志
- 一封信，内容和这封差不多

压缩包的密码我没有写在这台电脑上。她要是来找，什么也找不到。

这件事我己经想了很久，没想出更好的办法。可能这就是最好的办法，也可能不是。
末来的事我不知道。

许嘉
2000.4.4　16:18` },

  mails2026: [
    { id: "c6_m_push", from: "梧城晚报 <push@wcwb.cn>", date: "2026-10-31 22:30", subject: "【直播预告】零点，送别七中老水塔",
      requires: "ch6 & dlg_c6_d_xuning1",
      html: `<p>梧城七中旧校区拆除工程将于今夜零时开始，老水塔将第一个拆除。本报将在官方账号全程直播，欢迎老校友在线送别。</p><p style="color:#888;font-size:12px">退订请回复 TD</p>` },

  notes: {
    c6_n_pager: { text: "许国平笔记本：“2000年4月4日 晚8:10 嘉嘉最后一条传呼：3132636459。回了电话，机房没人接。”——清明.zip 的注释：“钥匙在我爸的呼机里。”" },
    c6_n_heman: { text: "何蔓知道我在和许宁联系了。她在旧校区门口，等我告诉她“许嘉藏东西的地方”。" },
    c6_n_poem: { text: "林晚最后的一首诗：《夏至》（BBS 原创文学，1999-06-20 22:14）。正文 8 行，行内没有标点。" },
    c6_n_zip: { text: "31 32 63 64 59 → 第3行第1字“晚”、第3行第2字“风”、第6行第3字“明”、第6行第4字“天”、第5行第9字“见”。晚风明天见。" },
    c6_n_letter: { text: "许嘉的信：铁皮饼干盒在水塔第七级铁梯下面的检修口。里面有林晚的日记、5.17 上机登记表原件、服务器日志软盘、一封信。他知道林晚不是自杀。" },
    c6_n_evidence: { text: "遗书的拼音同音错字；12 月 25 日的鸽讯备份；她说漏的“晚风”磁带。" },

  collectibles: {
    poem12: { title: "《第七盏》", text: "傍晚的水塔很高\n高到能看见整条梧桐路\n我数着路灯一盏一盏亮起来\n数到第七盏的时候\n就会有人从路口走过来\n抬起头叫我下去吃饭" },

  endings: {
    B: { title: "格式化", html: `<p>你把那句话发了出去：</p>
<p style="text-align:center">「水塔，第七级铁梯下面的检修口。」</p>
<p>何蔓回了一句“谢谢你”，头像暗了下去。</p>
<p>许宁打来三个电话，你一个都没接。第四个之后，她发来一条消息：“你告诉她了，是不是。”你没有回。</p>
<p>零点，旧校区的探照灯亮了。直播画面里，挖掘机的铁臂碰到水塔，砖块一层一层往下落，烟尘盖住了半个操场。镜头扫过围挡外的人群，看不清那里有没有站着一个穿灰色大衣的女人。</p>
<p>第二天的《梧城晚报》写道：七中旧校区拆除工程顺利完成，“老水塔在一声闷响中谢幕，许多老校友到场送别”。</p>
<p>一周后，何蔓发来一个快递单号，请你把 3 号机寄回学校，“作为校史资料保存”。她请你寄回之前把硬盘格式化，“里面有学生的隐私”。</p>
<p>你照做了。进度条从 0% 走到 100%。那段开机声再也没有响起来。</p>
<p>十二月，何蔓被评为梧城市优秀教师。报纸上的照片里，她站在新校区的讲台前，胸前别着一朵红花。她说：“教育，就是记住每一个孩子。”</p>
<p>许宁没有再联系你。那期视频，你也一直没有发。</p>
<p>年底的一个深夜，你收到一封邮件。发件人一栏是空的，发信时间显示：</p>
<p class="mono" style="text-align:center">1900-01-01 00:00</p>
<p>正文只有一行：</p>
<p style="text-align:center">谢谢你。在见。</p>` },

    C: { title: "归零", html: `<p>23 点 46 分，梧桐路 17 号，水塔下。</p>
<p>手电的光圈里，第七级铁梯下面那块铁板一推就开了，二十六年的锈落了周叔叔一手。铁皮饼干盒里的东西都在：一本蓝色塑料皮的日记，一张 1999 年 5 月 17 日的机房上机登记表，一张标着“WTBBS LOG”的软盘，一封折成三折的信。</p>
<p>许宁把日记翻到最后一页，拍给了你。</p>
<div class="paper hand">1999年6月20日　晴<br>今天是一年里最长的白天。<br>把《夏至》发上去了。<br>明天爸爸要在全校面前承认我。<br>他说他想了一年，不想再让我躲着了。<br>要说的话我都写在诗里了。明天，他们就会懂。</div>
<p>原来《夏至》不是遗书。</p>
<p>“可是明天会有人站出来／叫出我的名字／我就不用再躲在影子里了。”——那个要站出来的人，是她的父亲。她坐在水塔上，等一年里最长的白天慢慢变暗，等第二天。6 月 21 日傍晚七点四十分，生了锈的栏杆断了。</p>
<p>帖子没有逼死她。没有人逼死她。何蔓用了一整年去恨的那件事，从一开始就不存在。</p>
<p>零点过五分，许宁发来一段视频。何蔓站在校门口的路灯下，穿着一件灰色的大衣，比你想象的更瘦。警察走过去，她把手伸了出来。她只提了一个要求：让她看一眼那本日记。</p>
<p>许宁把最后一页拿给她。她看了很久，没有哭，也没有说话。</p>
<p>零点二十分，挖掘机进场。水塔是第一个。铁臂碰到塔身的时候，你在视频里听见许宁轻轻说了一句什么，被轰鸣声盖住了。烟尘落下去，梧桐路 17 号的夜空，第一次空出了一块。</p>
<p style="text-align:center">——</p>
<p>十二月，梧城市公安局对七中系列案件重新侦查，撤销了 2000 年 4 月 12 日的结论。何蔓对四起案件供认不讳。软盘里的日志一条都没有坏，和许嘉信里写的一模一样。</p>
<p>许嘉不是千年虫。</p>
<p>许宁把那封《给看到这些的人》打印出来，和父亲的笔记本一起放在哥哥的墓前。她说，她爸记了二十六年的那串数字，终于有人接了。</p>
<p>城西公墓，韩立的墓碑上只刻着名字和生卒年。许宁去的时候带了一张卡片，压在花下面，上面抄着《夏至》的最后一行。</p>
<p>3 号机没有进校史馆。它回到了你的工作台上，屏幕亮着，任务栏右下角的时钟还在从 2000 年 4 月 5 日早上七点四十分往前走。</p>
<p>你最后剪出来的视频只有六分钟，没有配乐。最后一个镜头，是黑底白字的一行：</p>
<p style="text-align:center">晚风明天见</p>
<p>简介里只写了一句：献给许嘉，和一个等了一整个夏天的女孩。</p>` },

    H: { title: "晚风", html: `<p class="mono" style="font-size:12px">站内信 · 草稿箱　收信人：jia　保存时间：1999-06-20 22:31　状态：未发送</p>
<div class="paper hand">嘉：<br><br>今天把《夏至》发上去了。你别笑，有几句是写给你看的，也不全是。<br><br>明天会有一件事。等它过去了，我就不用再躲着走了，不用再假装跟谁都不熟。<br><br>到那时候，我想跟你说一件事。不是今天。今天说出来，好像是要逃跑。<br><br>你切给我的那半块橡皮，我一直没舍得用完。以后也不打算用完了。<br><br>晚风</div>
<p>草稿箱里只有这一封。</p>
<p>你把鼠标移到“发送”上，停了很久。</p>
<p>然后你按了下去。</p>
<p>3 号机的硬盘轻轻响了一声。站内信列表刷新了：jia 的收件箱里，多了一封未读的信。</p>
<p>二十七年前的那个晚上，晚风从操场那边吹过来，吹乱了作业本。有一封信，终于寄到了。</p>` },
