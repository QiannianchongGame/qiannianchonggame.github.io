<script>/* src/i18n/en/ch0.js */
try {
// English translation — Prologue "Boot" (ch0). Keys mirror src/i18n/zh/ch0.js.
Y2K.lang('en', {
  "dlg.c0_d_hello.steps.0.npc": "Hello, {player}. This is He Man. The tracking says the package was signed for. Did everything arrive all right?",
  "dlg.c0_d_hello.steps.1.npc": "I was worried the whole way that it would get knocked about. That machine sat in a storeroom for more than twenty years.",
  "dlg.c0_d_hello.steps.2.choice.0.text": "Got it. The box was solid.",
  "dlg.c0_d_hello.steps.2.choice.0.reply.0": "Good.",
  "dlg.c0_d_hello.steps.2.choice.1.text": "I read your letter.",
  "dlg.c0_d_hello.steps.2.choice.1.reply.0": "It's a bit muddled. Please don't mind it.",
  "dlg.c0_d_hello.steps.2.choice.1.reply.1": "There are things I still haven't made sense of myself.",
  "dlg.c0_d_hello.steps.3.npc": "Oh, and the school's IT office asked me to record the machine's old network address. They say they need it for the demolition inventory.",
  "dlg.c0_d_hello.steps.4.npc": "There should be a label on the side of the case. Could you take a look for me?",
  "dlg.c0_d_hello.steps.6.npc": "Thank you. I'll report it now.",
  "dlg.c0_d_hello.steps.7.choice.0.text": "It wants a password to boot. Do you know it?",
  "dlg.c0_d_hello.steps.7.choice.0.reply.0": "I don't.",
  "dlg.c0_d_hello.steps.7.choice.0.reply.1": "I didn't know the first thing about computers back then. Xu Jia ran everything in the lab. And he never talked to anyone about that sort of thing.",
  "dlg.c0_d_hello.steps.7.choice.1.text": "I'll try booting it up first.",
  "dlg.c0_d_hello.steps.7.choice.1.reply.0": "All right. No rush. Take your time.",
  "dlg.c0_d_hello.steps.8.npc": "There's one more thing. I mentioned it in the letter, too.",
  "dlg.c0_d_hello.steps.9.npc": "Whatever you find in there, could you tell me first, each time? Please don't post a video yet, and don't tell anyone else for now.",
  "dlg.c0_d_hello.steps.10.npc": "Xu Jia was such a careful person. He may have left something behind. If you see him mention putting something somewhere, please be sure to let me know.",
  "dlg.c0_d_hello.steps.11.me": "Sure. I'll tell you when I find something.",
  "dlg.c0_d_hello.steps.12.npc": "Thank you, {player}.",
  "dlg.c0_d_bios.steps.0.me": "I got past the BIOS password. It was Xu Jia's birthday.",
  "dlg.c0_d_bios.steps.1.npc": "December 3rd... Yes. That photo was taken that very day. Zhou Ting organized the cake. She loved a party more than anyone back then.",
  "dlg.c0_d_bios.steps.2.npc": "You're much faster than I expected.",
  "dlg.c0_d_bios.steps.3.me": "The screen says the clock stopped at 7:40 a.m. on April 5, 2000.",
  "dlg.c0_d_bios.steps.5.npc": "That was the morning Mr. Han found him.",
  "dlg.c0_d_bios.steps.6.npc": "After that the machine was unplugged, and no one ever turned it on again〔没人在开过〕.",
  "item.c0_it_letter.name": "He Man's letter",
  "item.c0_it_letter.html": "<div class=\"paper\">\n<p>Dear {player},</p>\n<p>Forgive me for writing out of the blue. My name is He Man, and I am the Dean of Students at Wucheng No. 7 High School. I have watched your videos about restoring old computers online. You are very careful, and you treat old things with respect, so I would like to entrust this machine to you.</p>\n<p>It is Machine No. 3 from our school's old computer lab. From 1999 to 2000, my classmate Xu Jia used it to run a campus BBS called “Under the Wutong Tree.” Back then our whole class talked to each other on it.</p>\n<p>In the summer of 1999, my desk-mate Lin Wan fell from the school's water tower and died. That winter and into the next spring, three more of our classmates died, one after another. On the night of Qingming, April 4, 2000, Xu Jia died too, in the computer lab. The police concluded that he was responsible for what happened to those three classmates, and that he had killed himself to escape punishment.</p>\n<p>I don't believe it. Xu Jia hardly ever spoke, but he was not that kind of person. He liked Lin Wan. The whole class knew it; only he thought he was hiding it well.</p>\n<p>After the case was closed, the machine was returned to the school as evidence and sealed in the lab building's storeroom. No one has turned it on in twenty-six years. The old campus will be demolished entirely on November 1, storeroom included. Before that happens, I want to do one last thing for him.</p>\n<p>I don't know the startup password. How to repair it and how to go through it, I leave entirely to you. I only ask one thing: whatever you find inside, please tell me first. Please don't film a video yet, and don't tell anyone else.</p>\n<p>Once it reaches you, we'll talk again〔在联系〕.</p>\n<p style=\"text-align:right\">He Man<br>October 24, 2026</p>\n</div>\n<p class=\"faded\" style=\"font-size:12px\">(The letter is printed. Only the signature is handwritten.)</p>",
  "item.c0_it_photo.name": "Old photo from the envelope",
  "item.c0_it_photo.html": "<div class=\"photo\"><svg viewBox=\"0 0 640 420\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect width=\"640\" height=\"420\" fill=\"#2b2a26\"/>\n<rect x=\"0\" y=\"0\" width=\"640\" height=\"190\" fill=\"#3d4a4f\"/>\n<rect x=\"40\" y=\"40\" width=\"120\" height=\"90\" fill=\"#1e2427\" stroke=\"#8a9499\" stroke-width=\"3\"/>\n<rect x=\"190\" y=\"40\" width=\"120\" height=\"90\" fill=\"#1e2427\" stroke=\"#8a9499\" stroke-width=\"3\"/>\n<rect x=\"470\" y=\"40\" width=\"120\" height=\"90\" fill=\"#1e2427\" stroke=\"#8a9499\" stroke-width=\"3\"/>\n<text x=\"500\" y=\"92\" font-family=\"SimSun, 'Songti SC', serif\" font-size=\"16\" fill=\"#6fae7a\">C:\\&gt;_</text>\n<ellipse cx=\"250\" cy=\"230\" rx=\"38\" ry=\"44\" fill=\"#151515\"/><rect x=\"205\" y=\"262\" width=\"90\" height=\"120\" rx=\"20\" fill=\"#151515\"/>\n<ellipse cx=\"390\" cy=\"225\" rx=\"36\" ry=\"42\" fill=\"#1a1a1a\"/><rect x=\"348\" y=\"255\" width=\"84\" height=\"125\" rx=\"20\" fill=\"#1a1a1a\"/>\n<ellipse cx=\"120\" cy=\"240\" rx=\"34\" ry=\"40\" fill=\"#181818\"/><rect x=\"80\" y=\"268\" width=\"80\" height=\"115\" rx=\"20\" fill=\"#181818\"/>\n<ellipse cx=\"525\" cy=\"238\" rx=\"34\" ry=\"40\" fill=\"#181818\"/><rect x=\"485\" y=\"266\" width=\"80\" height=\"115\" rx=\"20\" fill=\"#181818\"/>\n<rect x=\"160\" y=\"330\" width=\"330\" height=\"90\" fill=\"#6b4f35\"/>\n<ellipse cx=\"320\" cy=\"330\" rx=\"95\" ry=\"22\" fill=\"#f1e6d0\"/><rect x=\"225\" y=\"300\" width=\"190\" height=\"30\" fill=\"#f1e6d0\"/><ellipse cx=\"320\" cy=\"300\" rx=\"95\" ry=\"20\" fill=\"#fff7e8\"/>\n<text x=\"320\" y=\"306\" text-anchor=\"middle\" font-family=\"KaiTi, STKaiti, serif\" font-size=\"15\" fill=\"#c0392b\">Happy Birthday</text>\n<rect x=\"296\" y=\"262\" width=\"8\" height=\"34\" fill=\"#e8c34a\"/><rect x=\"318\" y=\"262\" width=\"8\" height=\"34\" fill=\"#e8c34a\"/>\n<path d=\"M300 262 q-5 -10 0 -18 q5 8 0 18\" fill=\"#ffb347\"/><path d=\"M322 262 q-5 -10 0 -18 q5 8 0 18\" fill=\"#ffb347\"/>\n<text x=\"290\" y=\"258\" text-anchor=\"end\" font-family=\"SimSun, serif\" font-size=\"22\" fill=\"#ffdd88\">1</text>\n<text x=\"336\" y=\"258\" font-family=\"SimSun, serif\" font-size=\"22\" fill=\"#ffdd88\">7</text>\n<text x=\"600\" y=\"400\" text-anchor=\"end\" font-family=\"'Courier New', monospace\" font-size=\"22\" fill=\"#ff8a1e\">'98 12 3</text>\n</svg></div>\n<p>A slightly faded color photo. In the computer lab, a few students in school uniforms crowd around a cake, its candles shaped like a “1” and a “7”. The boy in the middle has his head down, as if he isn't used to having his picture taken.</p>\n<p>In the bottom-right corner is the orange date the camera printed on it.</p>\n<p><b>On the back</b> (ballpoint pen, a girl's handwriting):</p>\n<p class=\"hand\">Happy 17th birthday, Jia!<br>— the Senior Two, Class 2 computer lab crew</p>",
  "item.c0_it_tag.name": "Asset tag on the side of the case",
  "item.c0_it_tag.html": "<div class=\"scan mono\" style=\"padding:12px;line-height:1.7\">\nWucheng No. 7 High School　Fixed Asset Tag<br>\n━━━━━━━━━━━━━━━━━━━━<br>\nAsset No.:　QZ-1998-JF-003<br>\nItem:　　　Microcomputer (also BBS server)<br>\nHostname:　JF-03<br>\nIP Address: 192.168.1.103<br>\nLocation:　Lab Building, 3rd floor, computer lab<br>\nCustodian: Xu Jia (student)　Supervising teacher: Han Li<br>\nPurchased: September 1998<br>\n━━━━━━━━━━━━━━━━━━━━<br>\n<span class=\"hand\" style=\"font-size:15px\">BIOS boot password = custodian's birthday (6 digits: year, month, day, two digits each)　— Han</span>\n</div>\n<p>Below the tag is a later white seal strip, its writing yellowed with age:</p>\n<div class=\"scan\" style=\"padding:8px\"><span class=\"stamp\">EVIDENCE</span>　Case property returned　2000.04.20　｜　Sealed in Lab Building storeroom　2001.08</div>",
  "item.c0_it_note.name": "Sticky note on the monitor bezel",
  "item.c0_it_note.html": "<div class=\"paper\" style=\"max-width:260px;background:#fff6a8\">\n<p class=\"hand\" style=\"font-size:18px\">xujia</p>\n<p class=\"hand\" style=\"font-size:18px\">Password: her name,<br>typed my way.</p>\n</div>\n<p>A yellow sticky note on the lower-right edge of the monitor bezel. The glue has dried out; it falls off at a touch. The handwriting is a boy's: very small, very neat.</p>",
  "item.c0_it_card.name": "Wubi radical card",
  "item.c0_it_card.html": "<p>A laminated card the size of a playing card, tucked under the keyboard.</p>\n<div class=\"scan\" style=\"padding:10px\">\n<b>[Front]</b> Printed with “Wubi 86 Radical Quick Reference” (五笔字型 86 版 字根速查): five zones, twenty-five keys, crammed with radicals and mnemonic rhymes. The laminate has been rubbed shiny; the “G F D S A” row is almost worn away.\n</div>\n<div class=\"paper\" style=\"margin-top:8px\">\n<p><b>[Back]</b> (handwritten in fountain pen)</p>\n<p class=\"hand\">For entering the class directory:</p>\n<table class=\"mono\" style=\"font-size:14px;border-collapse:collapse\">\n<tr><td>许 xǔ (Xu) YTFH</td><td>　嘉 jiā (Jia) FKUK</td><td>　王 wáng (Wang) GGGG</td><td>　磊 lěi (Lei) DDDF</td></tr>\n<tr><td>林 lín (Lin; “forest”) SSY</td><td>　晚 wǎn (Wan; “evening”) JQKQ</td><td>　陈 chén (Chen) BAIY</td><td>　雨 yǔ (“rain”) FGHY</td></tr>\n<tr><td>周 zhōu (Zhou) MFKD</td><td>　婷 tíng (Ting) VYPS</td><td>　赵 zhào (Zhao) FHQI</td><td>　刘 liú (Liu) YJH</td></tr>\n<tr><td>宋 sòng (Song) PSU</td><td>　远 yuǎn (“far”) FQPV</td><td>　洋 yáng (Yang; “ocean”) IUDH</td><td>　风 fēng (“wind, breeze”) MQI</td></tr>\n<tr><td>苏 sū (Su) ALWU</td><td>　芮 ruì (Rui) AMWU</td><td>　何 hé (He) WSKG</td><td>　蔓 màn (Man; “vine”) AJLC</td></tr>\n</table>\n<p class=\"hand\">Ones I type a lot:</p>\n<p class=\"mono\" style=\"font-size:14px\">梧 wú (wutong tree) SGKG　桐 tóng (wutong tree) SMGK　树 shù (tree) SCFY　下 xià (under) GHI<br>七 qī (seven) AGN　中 zhōng (middle; “No. 7 High” = 七中) KHK　机 jī (machine) SMN　房 fáng (room) YNYV　站 zhàn (station, site) UHKG　长 zhǎng (chief) TAYI</p>\n<p class=\"hand\">Words:</p>\n<p class=\"hand\">2-character words — first two codes of each character　(e.g. 机房 jīfáng, “computer room” = SMYN)<br>\n3-character words — first code of each of the first two characters, then the first two codes of the last<br>\n4-character words — first code of each character</p>\n</div>\n<p class=\"faded\" style=\"font-size:12px\">(Translator's note: Wubi is a shape-based Chinese input method. Instead of spelling a character's sound, the typist breaks it into radicals; every character has a code of up to four letters. The pinyin readings and meanings beside each character are added for this translation; the card itself shows only the characters and their codes.)</p>",
  "item.c0_it_floppy.name": "3.5-inch floppy disk",
  "item.c0_it_floppy.html": "<div style=\"width:220px;height:230px;background:#222;border-radius:4px;position:relative;margin:8px auto\">\n<div style=\"position:absolute;left:50px;top:0;width:120px;height:70px;background:#b8b8b8\"></div>\n<div style=\"position:absolute;left:20px;top:110px;width:180px;height:100px;background:#f4f0e2;padding:8px;box-sizing:border-box\">\n<span class=\"hand\" style=\"font-size:40px\">嘉</span></div></div>\n<p>A black 3.5-inch floppy disk, write-protect tab open. The label has a single character on it in blue fountain pen: 嘉 (jiā, “Jia”).</p>\n<p>One corner of the label has curled up. There seems to be another, older label underneath, with faint pencil marks showing through.</p>",
  "item.c0_it_label.name": "The floppy's old label (peeled back)",
  "item.c0_it_label.onOpen.toast": "Collectible found: Lin Wan's poem manuscripts (1/12)",
  "item.c0_it_label.html": "<p>With a fingernail, you slowly lift the label with “嘉” on it. Underneath is an older label with a few small lines in pencil, in someone else's handwriting, very light:</p>\n<div class=\"paper\"><p class=\"hand\" style=\"font-size:17px\">Lamp<br><br>The lab's light is always the last one on<br>I walk over from the sports field<br>count to the third window on the third floor<br>it's still lit<br><br>— Wan</p></div>\n<p class=\"faded\">(You press the “嘉” label back into place. It was probably put there in the first place to cover these lines.)</p>",
  "puzzle.c0_tag.title": "Machine No. 3's network address",

  "note.c0_n_tag.text": "Machine No. 3: hostname JF-03, IP 192.168.1.103. Custodian: student Xu Jia; supervising teacher: Han Li. BIOS boot password = custodian's birthday (6 digits: year, month, day, two digits each).",

  "file.c1_classbook.html": `<h3 style="text-align:center">Wucheng No. 7 High · Senior Two, Class 2 · Class Directory (BBS edition)</h3>

  "file.c1_timetable.text": "Senior Two, Class 2 — Timetable, 1998–1999 school year, 2nd semester\n\n        Mon       Tue       Wed       Thu       Fri       Sat\n1       Chinese   Math      English   Physics   Math      Math\n2       Math      English   Chinese   Chem      Chinese   English\n3       English   Physics   Math      Chinese   English   Chinese\n4       Physics   Chem      PE        Math      Bio       (extra class)\nLunch break\n5       Chem      Chinese   Computer  English   Physics\n6       Bio       PE        Computer  Politics  Chem\n7       Homeroom  History   Geography Study     Study\n\nEvening self-study 18:40–21:30 (Mon & Wed, 2nd period: computer use allowed, must sign in)\n\n——————————————\nWed afternoon computer class: computer lab\nLab duty: Mon Xu Jia　Wed Xu Jia　(any other time, ask Mr. Han)\n",

  "file.c1_tihui.text": "Final-round problems, from memory (computer exam, 5.17 evening, 19:00–22:00)\n\n1. The Wutong Trees at the School Gate (greedy) — given the positions of N trees, enclose them with the shortest rope. Done in 30 minutes.\n2. Robot Moving Bricks (BFS) — 50×50 map, watch the boundaries. Took an hour; only passed the sample in the last 10 minutes.\n3. String Compression (DP) — didn't finish. Partial credit only.\n\nThe exam machines were even older than ours in the lab. The J key was loose.\nHanded in at 21:58.\n\nOn the way back to the guesthouse I realized problem 3 was actually interval DP.\n\nResult: Provincial Second Prize. 15 points short of First.\n",
  "file.c1_todo.text": "To do\n\n[x] Write up the contest problems, post on the Computers board\n[ ] Mouse on lab machine 23 is broken, report to Mr. Han\n[ ] Return Xiaoyu's physics notes\n[ ] Water tower railing — reported in April. Has the facilities office replied? Ask again\n[ ] BBS: pagination bug on Original Writing, gets jumbled when there are lots of posts\n[ ] v1.3: add a \"Delete permanently\" button to the admin recycle bin (right now it only hides)\n[ ] Summer lab opening hours, discuss with Mr. Han\n",
  "file.c1_xiaokan.html": `<h2 style="text-align:center">W u t o n g</h2>
<p style="text-align:center" class="faded">Wucheng No. 7 High School magazine · 1999, Issue 4 (July) · Student layout: Xu Jia</p>
<hr>
<h4>■ Good news: our student wins a prize at the Provincial Informatics Competition</h4>
<p>From May 16 to 18, the final round of the 1999 Provincial Youth Informatics Competition was held in the provincial capital. Xu Jia of Senior Two, Class 2 won a Provincial Second Prize, our school's best result ever in this event. Supervising teacher: Han Li.</p>
<h4>■ Senior Three graduation ceremony held</h4>
<p>On the morning of June 30, the graduation ceremony for our class of 1999 was held in the auditorium. The principal's words to the graduates: "However far you go, don't forget No. 17 Wutong Road."</p>
<h4>■ In deep mourning for Lin Wan</h4>
<p>At about 7:40 p.m. on June 21, Lin Wan of Senior Two, Class 2 fell from the top platform of the school water tower. Despite emergency treatment, she could not be saved. She was only sixteen.</p>
<p>After an on-site investigation, the public security authorities determined that the accident was caused by the rusted-through outer railing of the water tower platform, and ruled it an accident. The school has closed off the water tower since June 22 and is carrying out a full safety inspection of all school facilities.</p>
<p>Lin Wan transferred to our school in September 1998. She loved literature, and was the moderator of the Original Writing board on Under the Wutong Tree. May she rest in peace.</p>
<h4>■ Summer safety reminders</h4>
<p>Swimming in East Lake or the city moat is strictly forbidden; climbing the water tower, walls or any other high place is strictly forbidden; do not enter commercial internet cafés or game arcades.</p>
<p class="faded" style="text-align:right">— Wutong editorial office</p>`,

  "file.c1_handover.text": "To Mr. Han:\n\nAdmin account: sysop\nInitial password: wutong1008 (the day the site opened)\n\nAdmin panel: http://192.168.1.103/admin/\nDeleting posts, banning IPs, viewing the login log — it's all in there.\n\nPlease delete this file once you've read it.\n— Xu Jia",
  "file.c1_draft.text": "Regarding the Recent Inappropriate Post (draft)\n\nAt 21:03 on the evening of May 17, a post appeared in Chatterbox. It was posted with the sysop account.\n\nI did not write that post.\nFrom the 16th to the 18th I was in the provincial capital for the competition. On the evening of the 17th, from 19:00 to 22:00, I was in the exam room doing the computer exam. No floppy disks allowed, no network. Mr. Han and the teacher who led our team can both confirm this.\n\nSomeone knew the sysop password.\nI have already〔己经〕 changed the password and deleted the post.\n\nTo Lin Wan,\n\n————————\n\nForget it.\nThe more I write, the more it looks like I wrote it.\nKeep it short.\n\n(The rest of what I have to say is in another file. Hide it well. Don't let anyone see it.)\n",
  "file.c1_unsent.props": { "Comments": "Not sent" },
  "file.c1_unsent.text": "Lin Wan:\n\nI didn't write that post.\nI know you know. But I still wanted to say it myself.\n\nYou said not to look into it. I promised you.\nBut I still want to know who it was.\n\nI'm not good at talking. I type fast and talk slowly.\nIn the lab you sat next to me and watched me type, and said my hands looked like they were playing the piano. I didn't tell you I made a lot of typos that day.\n\nThat poem of yours, March — I didn't see it until the next day.\nI feel the same.\n\n— Jia\nWritten 1999.5.23, not sent\n\n————\n\n6.21, morning\n\nYesterday you said you'd tell me something today.\nThen I'll tell you today too.\nThat's a promise.\n",
  "file.c1_typing.text": "Wubi typing practice (session 7)\n\nPractice text: \"Wutong\"\nTime: 2 min 06 s　Characters: 296　Speed: 141 chars/min　Errors: 2\n\n————\n\nLin Wan's first try (11.27, computer lab):\nTime: 5 min 40 s　Characters: 118　Speed: 21 chars/min　Errors: 11\n\n(She said she'd stick to writing by hand. I said a few more tries and she'd get the hang of it.)\n",

  // ===================== 2026 phone dialogues (He Man) =====================
  "dlg.c1_d_start.steps.0.me": "I'm into the system.",
  "dlg.c1_d_start.steps.1.npc": "Really?",
  "dlg.c1_d_start.steps.2.npc": "Is there an “Under the Wutong Tree” on the desktop? That's the BBS Xu Jia made. Back then we said everything on there.",
  "dlg.c1_d_start.steps.3.npc": "The whole site lives on that machine. The posts, the poems... it's all there.",
  "dlg.c1_d_start.steps.4.choice.0.text": "How did Lin Wan die?",
  "dlg.c1_d_start.steps.4.choice.0.reply.0": "June 21, 1999. The summer solstice.",
  "dlg.c1_d_start.steps.4.choice.0.reply.1": "She was sitting alone on the water tower watching the sunset, and the railing gave way.",
  "dlg.c1_d_start.steps.4.choice.0.reply.2": "The school said it was an accident. But I always knew it wasn't.",
  "dlg.c1_d_start.steps.4.choice.1.text": "I'll look at the BBS first.",
  "dlg.c1_d_start.steps.4.choice.1.reply.0": "All right.",
  "dlg.c1_d_start.steps.5.npc": "Go and have a look. Her poems are all on Original Writing.",
  "dlg.c1_d_start.steps.6.npc": "I won't keep you. Whatever you find, tell me then〔在跟我说〕.",
  "dlg.c1_d_xiazhi.steps.0.me": "I found Summer Solstice.",
  "dlg.c1_d_xiazhi.steps.1.npc": "That was her last one. The evening after she posted it, she...",
  "dlg.c1_d_xiazhi.steps.2.npc": "“And then I won't have to hide in the shadows anymore〔不用在躲〕.”",
  "dlg.c1_d_xiazhi.steps.3.npc": "I can still recite it. Tell me: if that isn't a goodbye, what is it?",
  "dlg.c1_d_xiazhi.steps.4.choice.0.text": "Maybe it means something else.",
  "dlg.c1_d_xiazhi.steps.4.choice.0.reply.0": "...I'd like to think so too.",
  "dlg.c1_d_xiazhi.steps.4.choice.0.reply.1": "But it's been more than twenty years, and I can't think what else it could mean.",
  "dlg.c1_d_xiazhi.steps.4.choice.1.text": "Someone replied underneath: “I saw it.”",
  "dlg.c1_d_xiazhi.steps.4.choice.1.reply.0": "That was Xu Jia.",
  "dlg.c1_d_xiazhi.steps.4.choice.1.reply.1": "His replies were never more than a few words. That one, I stared at for a long time.",
  "dlg.c1_d_delnotice.steps.0.me": "There's a notice in Announcements about a deleted post. It says a post from the evening of May 17 was taken down.",
  "dlg.c1_d_delnotice.steps.1.npc": "...That post.",
  "dlg.c1_d_delnotice.steps.2.npc": "The whole school read it. After it was deleted, no one ever saw it again〔没在见过〕.",
  "dlg.c1_d_delnotice.steps.3.npc": "Once something's deleted, there's no getting it back, is there? I don't understand these things.",
  "dlg.c1_d_rumor.steps.0.me": "I opened that deleted post.",
  "dlg.c1_d_rumor.steps.2.npc": "You could open it?",
  "dlg.c1_d_rumor.steps.3.npc": "Twenty-six years.",
  "dlg.c1_d_rumor.steps.4.npc": "Back then everyone thought Xu Jia wrote it. It came from the sysop account. Who would suspect anyone else?",
  "dlg.c1_d_rumor.steps.5.npc": "But she saw it. She read every word of it.",
  "dlg.c1_d_rumor.steps.6.choice.0.text": "The post came from IP 192.168.1.107.",
  "dlg.c1_d_rumor.steps.6.choice.0.reply.0": "What does that mean?",
  "dlg.c1_d_rumor.steps.6.choice.0.reply.1": "...A computer at the school?",
  "dlg.c1_d_rumor.steps.6.choice.0.reply.2": "I don't understand these things. Tell me once you've found out〔在告诉我〕.",
  "dlg.c1_d_rumor.steps.6.choice.1.text": "Whoever wrote that post was vicious.",
  "dlg.c1_d_rumor.steps.6.choice.1.reply.0": "Yes.",
  "dlg.c1_d_rumor.steps.6.choice.1.reply.1": "But all of them went on just fine afterwards. At least back then.",
  "dlg.c1_d_rumor.steps.7.npc": "Xu Jia once said his admin panel kept a record of everything. Who logged in, when, and from where.",
  "dlg.c1_d_rumor.steps.8.npc": "Maybe it will show something.",
  "dlg.c1_d_host.steps.0.me": "192.168.1.107 is Machine No. 7 in the computer lab, JF-07.",
  "dlg.c1_d_host.steps.1.npc": "A lab computer... So it was someone at our school.",
  "dlg.c1_d_host.steps.2.npc": "That day was a Monday. You could use the computers during evening self-study. The lab would have been full.",
  "dlg.c1_d_host.steps.3.npc": "Can you find out who was sitting there?",
  "dlg.c1_d_host.steps.4.me": "Not yet.",
  "dlg.c1_d_host.steps.5.npc": "Mm. No rush.",
  "dlg.c1_d_alibi.steps.0.me": "When the post went up, Xu Jia was in an exam room in the provincial capital, taking a computer exam from seven to ten that evening.",
  "dlg.c1_d_alibi.steps.2.npc": "So it really wasn't him.",
  "dlg.c1_d_alibi.steps.3.npc": "I remember he'd gone to the competition. But back then everyone said he was the sysop, he could post from anywhere.",
  "dlg.c1_d_alibi.steps.4.npc": "I didn't know the first thing about computers, so I didn't know how to speak up for him.",
  "dlg.c1_d_alibi.steps.5.npc": "If only someone had been able to explain it back then.",
  "dlg.c1_d_admin.steps.0.me": "I got into the admin panel. The new password he set has to do with Lin Wan's first poem.",
  "dlg.c1_d_admin.steps.1.npc": "...It doesn't surprise me at all that he'd choose a password like that.",
  "dlg.c1_d_admin.steps.2.npc": "He never told her. The whole class could see it; only he thought he was hiding it well.",
  "dlg.c1_d_admin.steps.3.npc": "What's in the admin panel?",
  "dlg.c1_d_admin.steps.4.choice.0.text": "The login log: a few minutes before the rumor post, the sysop account logged in from 192.168.1.107.",
  "dlg.c1_d_admin.steps.4.choice.0.reply.0": "But he wasn't even at school those days...",
  "dlg.c1_d_admin.steps.4.choice.0.reply.1": "Then someone knew his password.",
  "dlg.c1_d_admin.steps.4.choice.1.text": "Evening Breeze's account last logged in on February 14, 2000.",
  "dlg.c1_d_admin.steps.4.choice.1.reply.0": "...That's impossible.",
  "dlg.c1_d_admin.steps.4.choice.1.reply.1": "She'd been gone more than half a year by then.",
  "dlg.c1_d_admin.steps.4.choice.1.reply.2": "Could the computer have got it wrong? It's such an old machine.",
  "dlg.c1_d_admin.steps.5.npc": "Oh, and there's PigeonChat on his computer, isn't there? We all chatted on it back then.",
  "dlg.c1_d_admin.steps.6.npc": "There may be chats between him and me in there. Just little things. Go ahead and look.",
  "dlg.c1_d_admin.steps.7.npc": "If you see him mention putting something somewhere, let me know.",
  "dlg.c1_d_gexun.steps.0.me": "I got into PigeonChat too. The password was the four characters Lin Wan hid in March.",
  "dlg.c1_d_gexun.steps.1.npc": "March...",
  "dlg.c1_d_gexun.steps.2.npc": "Under the Wutong Tree.",
  "dlg.c1_d_gexun.steps.3.npc": "She told me that poem was written for one person to read. I asked who. She wouldn't say.",
  "dlg.c1_d_gexun.steps.4.npc": "So he saw it after all.",
  "dlg.c1_d_gexun.steps.6.npc": "In the chat logs, is there any mention of... something?",
  "dlg.c1_d_gexun.steps.7.choice.0.text": "No, just everyday chatter.",
  "dlg.c1_d_gexun.steps.7.choice.0.reply.0": "Mm.",
  "dlg.c1_d_gexun.steps.7.choice.0.reply.1": "Good. ...I mean, all that was a long time ago.",
  "dlg.c1_d_gexun.steps.7.choice.1.text": "There's one between the two of you. You said, “I won't let them get away with it.”",
  "dlg.c1_d_gexun.steps.7.choice.1.reply.0": "...Did I say something like that.",
  "dlg.c1_d_gexun.steps.7.choice.1.reply.1": "I was only sixteen. At that age you'll say anything.",
  "dlg.c1_d_unsent.steps.0.me": "I found a letter Xu Jia wrote to Lin Wan and never sent.",
  "dlg.c1_d_unsent.steps.1.npc": "What did he write?",
  "dlg.c1_d_unsent.steps.2.me": "That he didn't write the post. And about March, he said he felt the same.",
  "dlg.c1_d_unsent.steps.4.npc": "When did he write the last part?",
  "dlg.c1_d_unsent.steps.5.me": "The morning of June 21.",
  "dlg.c1_d_unsent.steps.6.npc": "That evening, she...",
  "dlg.c1_d_unsent.steps.7.npc": "If only he'd said it sooner.",
  "dlg.c1_d_end.steps.0.me": "I've pieced together what happened to Lin Wan. Xu Jia didn't post it.",
  "dlg.c1_d_end.steps.1.npc": "...Thank you.",
  "dlg.c1_d_end.steps.2.npc": "Twenty-six years, and this is the first time I've heard anyone lay it out clearly.",
  "dlg.c1_d_end.steps.3.npc": "But the person who sat at Machine No. 7, to this day no one knows who it was.",
  "dlg.c1_d_end.steps.4.npc": "It's late. Get some rest. Doesn't the hard drive still have to run all night? Look again tomorrow〔明天在看〕.",
  "dlg.c1_d_end.steps.5.npc": "See you〔在见〕, {player}.",

  "file.c4_wav0315.tape.label": "20000315  Morning broadcast replay",
  "file.c4_wav0315.tape.speeds.1": `(Chime: ding — dong —)
A gentle, slightly nervous girl's voice: “Good morning, this is the No. 7 High radio station. Today is Wednesday, March 15, and I'm Li Jing. Welcome to Request Line.”
“Our first request card comes from a student in Junior Two, Class 3, for his deskmate — happy birthday to her. The song is ‘Paper Stars.’”
(A bouncy guitar intro and a man singing; the lyrics are buried under the line hiss.)
“Our second request card... has no name on it. It's for Su Rui in Senior Three, Class 2. The message says —”
(She pauses.)
“‘Don't be afraid. You're not alone.’”
“The song is ‘When the Snow Comes Down.’”
(Piano intro.)`,
  "file.c4_wav0315.tape.speeds.2": "(A thin, rapid squeak, like a cartoon mouse introducing a show. The only words you can make out are “Request Line.”)",
  "file.c4_wav0315.tape.speeds.0.5": "(A girl's voice dragged out low and long, like someone talking through a thick quilt. Then some music, so slow it seems about to stop.)",
  "file.c4_wav0315.tape.speeds.0.75": "(The voice is a little low and a little slow, like a tape recorder with dying batteries. You can tell it's a girl reading out request cards.)",
  "file.c4_wav0315.tape.speeds.1.5": "(Fast and a bit shrill: “...for Su Rui in Senior Three, Class 2... don't be afraid...” The piano after it sounds like it's in a hurry.)",

  "file.c4_wav0317.tape.label": "20000317  Morning broadcast replay",
  "file.c4_wav0317.tape.speeds.1": `(Chime: ding — dong —)
Su Rui (bright, crisp announcer's diction): “Good morning, No. 7 High! Today is Friday, March 17. Welcome to Weekend Plans — I'm your announcer, Su Rui!”
“It'll be sunny this weekend, with a high of twelve degrees. The ice on East Lake Park has melted, so everyone please stay away from the lakeshore...”
(She pauses, and her voice drops a little.)
“...And lately, everyone, please try to walk home together in the evenings, and get home early.”
(Laughing again) “Okay! Have a great weekend, and see you next Monday!”
(Chime. Then the morning exercise music.)`,
  "file.c4_wav0317.tape.speeds.2": "(A shrill, rapid babble, like a tape on fast-forward.)",
  "file.c4_wav0317.tape.speeds.0.5": "(A deep, drawn-out voice; every word is stretched over several seconds. Impossible to tell what it's saying.)",
  "file.c4_wav0317.tape.speeds.0.75": "(A slow, muffled girl's voice. You can just about tell it's Su Rui's delivery.)",
  "file.c4_wav0317.tape.speeds.1.5": "(Fast and shrill: “Good morning, No. 7 High! Today is... Friday... have a great weekend!”)",

  "file.c4_wav0320.tape.label": "20000320  Morning broadcast replay",
  "file.c4_wav0320.tape.speeds.1": `(Chime: ding — dong —)
Su Rui (bright, crisp announcer's diction): “Good morning, No. 7 High! Today is Monday, March 20, 2000 — the fifteenth day of the second lunar month, and the spring equinox! Welcome to The Week Ahead, every Monday. I'm your announcer, Su Rui!”
“The college entrance exam is now just — one hundred and nine days away! Senior Threes, go for it!”
“Now for this week's campus news. First: this Wednesday, after the second afternoon period, there will be a school-wide cleanup... Second: on March 29, Senior Three will hold the Hundred-Day Pledge Rally on the sports field...”
(Partway through she misreads a word, lets out a soft “ah,” and carries on.)
“...Okay, that's all for today's Week Ahead. The equinox is here, and the days will only get longer. Tomorrow morning at seven — don't miss it!”
(Chime. Then about ten minutes of morning exercise music.)`,
  "file.c4_wav0320.tape.speeds.2": "(A thin, rapid voice, like a mouse blurting out quiz answers: “Goodmorning-No.7-High-today-is... Monday... equinox... don't-miss-it!”)",
  "file.c4_wav0320.tape.speeds.0.5": "(A voice dragged out low and long, like a drowsy large animal talking. From the rhythm you can tell it's announcing something, but not a single word is clear.)",
  "file.c4_wav0320.tape.speeds.0.75": "(Low and slow, like a tape recorder with dying batteries. You can just about make out “Good morning, No. 7 High.”)",
  "file.c4_wav0320.tape.speeds.1.25": "(Slightly fast and slightly high, but the words are clear: “Good morning, No. 7 High! Today is Monday, March 20, 2000...”)",
  "file.c4_wav0320.tape.speeds.1.5": "(Fast and shrill: “Good morning, No. 7 High! Today is March twentieth, Monday... equinox... don't miss it!”)",

  "file.c4_wav0321.props": {"Note":"Taken offline (at the principal's office's request)"},
  "file.c4_wav0321.tape.label": "20000321  Morning broadcast replay (offline)",
  "file.c4_wav0321.tape.speeds.1": `(Chime: ding — dong —)
(No “Good morning, No. 7 High.”)
(A low, drawn-out voice, the sounds smeared together, like someone speaking from deep underwater. You can tell there are a few syllables, but not a single word is clear. About ten seconds.)
(Hiss of line noise.)
(A girl's voice, very soft, as if right up against the microphone, reading word by word —)
“Before First Period.”
“The fog on the sports field hasn't lifted yet
the student on duty lifts the chairs down one by one
on the windowpane someone has finger-written half a name
after the sun comes up
it slowly fades away
I want to be that half a name
seen for a little while
and that's enough”
(After the reading, a long stretch of nothing but hiss.)
(07:06 — the sound cuts off abruptly.)`,
  "file.c4_wav0321.tape.speeds.2": `(The chime turns shrill and short.)
(At last the voice sounds normal. Flat, pressed level, no rise or fall — impossible to tell whether it's a man or a woman —)
“The third one.”
“Reset to zero.”
(Hiss.)
(The girl reading the poem afterward is sped up into a thin, rapid squeak, like a tape on fast-forward.)`,
  "file.c4_wav0321.tape.speeds.0.5": `(An extremely low, extremely slow drone, like machinery heard through a wall, lasting nearly half a minute. No words can be made out.)
(Then a girl's voice stretched out very, very long, low and muffled, like someone reciting something underwater.)`,
  "file.c4_wav0321.tape.speeds.0.75": `(A deep hum; a single sound is stretched across several seconds. You can't tell whether it's a man or a woman, let alone make out words.)
(After it, a girl reading a poem — a little slow, a little muffled.)`,
  "file.c4_wav0321.tape.speeds.1.25": `(The voice is a little faster but still muffled, like someone talking with something in their mouth: “The... ...one”... you can't catch the rest.)
(The girl reading the poem sounds slightly fast and slightly high.)`,
  "file.c4_wav0321.tape.speeds.1.5": `(The voice is a bit clearer, but still low and slow: “The... third... one. Reset... to...” — the last word smears into a blur.)
(The poem reading after it is so fast it's almost comical.)`,

XZS-01</td><td>192.168.1.210</td><td>Admin bldg., principal's office</td><td>1999-12-15</td><td>Xu Jia, Han Li</td><td>Mr. Han came along</td></tr><tr style=\"background:#f6d6d6\"><td><b>JYS-486</b></td><td><b>192.168.1.200</b></td><td>Lab bldg. 2F, computer staff room</td><td><b>NOT PATCHED</b></td><td>—</td><td>Mr. Han won't let anyone touch it. Says the grade database is on it</td></tr></table><p>Total: 43 machines. 42 already patched〔己整改〕. 1 not patched (JYS-486).</p><p>Notes:<br>1. Patch used: Y2KFIX 2.1. After patching, set the clock to 1999-12-31 23:59 to test the rollover, then tested 2000-02-29 with DATE under DOS. All normal.<br>2. JYS-486 is a 486 DX2 with a very old BIOS. Unpatched, after 2000 its system year turns into 1900; month, day, hour and minute keep running normally.<br>3. Mr. Han says the grade database is on the 486 and if it breaks there'll be no explaining it, so he won't let me touch it. I said I could back it up first. He said no need.<br>4. The announcement only says “one machine in the staff room has not yet been patched.” No reason given.</p>",

<script>/* src/i18n/ja/ch0.js */
try {
// 日本語訳：序章「起動」。原文対照表 src/i18n/zh/ch0.js
Y2K.lang('ja', {
  "dlg.c0_d_hello.steps.0.npc": "{player}さん、こんにちは。何蔓です。配達済みになっていましたが、荷物は無事に届きましたか？",
  "dlg.c0_d_hello.steps.1.npc": "途中で壊れないか、ずっと心配していました。あの機械は二十年以上も倉庫に置かれていたので。",
  "dlg.c0_d_hello.steps.2.choice.0.text": "届きました。箱、しっかりしてましたよ。",
  "dlg.c0_d_hello.steps.2.choice.0.reply.0": "よかった。",
  "dlg.c0_d_hello.steps.2.choice.1.text": "お手紙、読みました。",
  "dlg.c0_d_hello.steps.2.choice.1.reply.0": "まとまりのない文章で、すみません。",
  "dlg.c0_d_hello.steps.2.choice.1.reply.1": "自分でも、いまだに整理がついていないことがあって。",
  "dlg.c0_d_hello.steps.3.npc": "そういえば、学校の情報課から、この機械がもともと使っていたネットワークアドレスを登録してほしいと言われているんです。取り壊しの備品整理に必要だとかで。",
  "dlg.c0_d_hello.steps.4.npc": "本体の側面にラベルが貼ってあるはずです。ちょっと見ていただけますか？",
  "dlg.c0_d_hello.steps.6.npc": "ありがとうございます。すぐに報告しておきます。",
  "dlg.c0_d_hello.steps.7.choice.0.text": "起動にパスワードが要るんですけど、ご存じですか？",
  "dlg.c0_d_hello.steps.7.choice.0.reply.0": "わかりません。",
  "dlg.c0_d_hello.steps.7.choice.0.reply.1": "私、当時はパソコンのことなんて何もわからなくて。パソコン室のことは全部許嘉が管理していました。彼もそういう話は人にしない人でしたし。",
  "dlg.c0_d_hello.steps.7.choice.1.text": "とりあえず起動してみます。",
  "dlg.c0_d_hello.steps.7.choice.1.reply.0": "はい。急ぎませんから、ゆっくりどうぞ。",
  "dlg.c0_d_hello.steps.8.npc": "それと、手紙にも書いたことなんですが。",
  "dlg.c0_d_hello.steps.9.npc": "中で何を見ても、何かわかったら、まず私に教えてもらえますか？動画はまだ出さないで、ほかの人にも話さないでください。",
  "dlg.c0_d_hello.steps.10.npc": "許嘉はあれだけ細かい人でしたから、何か残しているかもしれません。もし彼が何かをどこかに置いた、というような話が出てきたら、必ず教えてください。",
  "dlg.c0_d_hello.steps.11.me": "わかりました。進展があったら連絡します。",
  "dlg.c0_d_hello.steps.12.npc": "ありがとうございます、{player}さん。",
  "dlg.c0_d_bios.steps.0.me": "BIOS のパスワード、解けました。許嘉の誕生日でした。",
  "dlg.c0_d_bios.steps.1.npc": "12月3日……ええ、あの写真はその日に撮ったものです。ケーキは周婷が手配して買ってきたんです。あの子はあの頃、にぎやかなことが一番好きでした。",
  "dlg.c0_d_bios.steps.2.npc": "思っていたよりずっと早いですね。",
  "dlg.c0_d_bios.steps.3.me": "画面には、時計が2000年4月5日の朝7時40分で止まっているって出てます。",
  "dlg.c0_d_bios.steps.5.npc": "韓先生が彼を見つけた、あの朝です。",
  "dlg.c0_d_bios.steps.6.npc": "そのあと機械は電源を抜かれて、それきり誰ももう一度〔在〕電源を入れたことはありません。",
  "item.c0_it_letter.name": "何蔓の手紙",
  "item.c0_it_letter.html": `<div class="paper">
<p>{player}さん</p>
<p>突然のお便り、失礼いたします。梧城市第七中学で生活指導主任をしております、何蔓と申します。ネットで{player}さんの古いパソコンを修理する動画を拝見しました。とても丁寧で、古いものを大切に扱っていらっしゃるのが伝わってきたので、この機械をお任せしたいと思いました。</p>
<p>これは本校の旧パソコン室の3号機です。1999年から2000年にかけて、私の同級生の許嘉がこれを使って「梧桐の木の下」という校内BBSを立ち上げました。当時はクラスのみんなが、そこで言葉を交わしていました。</p>
<p>1999年の夏、私の隣の席だった林晩が、学校の給水塔から転落して亡くなりました。その冬から翌年の春にかけて、私たちのクラスではさらに三人の同級生が相次いで亡くなりました。2000年4月4日、清明節の夜には、許嘉もパソコン室で亡くなりました。警察の最終的な結論は、三人の件はすべて許嘉の仕業で、彼は罪を恐れて自殺した、というものでした。</p>
<p>私は信じていません。許嘉は口数の少ない人でしたが、そんなことをする人ではありませんでした。彼が林晩を好きだったことはクラスの誰もが知っていて、うまく隠せているつもりだったのは本人だけでした。</p>
<p>事件が終結したあと、この機械は証拠品として学校に返還され、ずっと実験棟の倉庫に封印されていました。二十六年間、誰も電源を入れていません。旧校舎は11月1日に全面的に取り壊されることになっていて、倉庫もその中にあります。その前に、彼のために最後に少しだけ何かをしてあげたいのです。</p>
<p>起動パスワードは知りません。修理の仕方も、中の見方も、すべてお任せします。ただ一つだけお願いがあります。中で何を見つけても、まず私に教えてください。動画はまだ撮らないで、ほかの人にも話さないでください。</p>
<p>お手元に届きましたら、改めて〔在〕ご連絡いたします。</p>
<p style="text-align:right">何蔓<br>2026年10月24日</p>
</div>
<p class="faded" style="font-size:12px">（手紙はプリンターで印刷されていて、署名だけが手書きだ。）</p>`,
  "item.c0_it_photo.name": "封筒に入っていた古い写真",

<p>少し色あせたカラー写真。パソコン室で、制服姿の生徒が何人か、ケーキを囲んでいる（ケーキの文字「生日快乐」は「誕生日おめでとう」）。ろうそくは「1」と「7」の形。真ん中の男子はうつむいていて、撮られるのに慣れていないようだ。</p>
<p>写真の右下には、カメラが写し込んだオレンジ色の日付。</p>

<p>ラベルの下には、あとから貼られた白い封印シールがあり、文字はすっかり黄ばんでいる：</p>

  "item.c0_it_note.name": "モニターの枠に貼られた付箋",
  "item.c0_it_note.html": `<div class="paper" style="max-width:260px;background:#fff6a8">
<p class="hand" style="font-size:18px">xujia</p>
<p class="hand" style="font-size:18px">パスワード：彼女の名前を、<br>僕の打ち方で。</p>
</div>
<p>黄色い付箋が、モニターの右下の枠に貼ってある。糊はすっかり乾いていて、触れただけで剥がれ落ちそうだ。男子の字で、小さく、とても几帳面だ。（原文は中国語：「密码：她的名字，用我的方式打。」）</p>`,
  "item.c0_it_card.name": "五筆入力の字根カード",
  "item.c0_it_card.html": `<p>トランプほどの大きさのラミネートカード。キーボードの下に挟まっていた。</p>
<div class="scan" style="padding:10px">

1.1

07:10 帰宅。グラウンドの横を通ったら、給水塔のあたりにロープが張られて、人だかりができていた。
十時に磊磊からポケベル。それで周婷だと知った。
午後、警察が二人、家に来た。聞かれたのは三つ：
1. 零時前後、どこにいたか。——パソコン室。
2. 証明できる人はいるか。——いない。サーバーのログだけ。
3. X はおまえか。
周婷のポケベルに、X と署名された呼び出しが一件あったという。内容は教えてもらえなかった。

その通り。書き換えられる。だから何の証明にもならない。


1.2

警察がもう一度来た。零時十分ごろ、給水塔のてっぺんのデッキから落ちたらしい。事故の線が強いそうだ。
千年虫の書き込みはいたずらだろう、と——"ひとつめ"は"2000年最初の書き込み"という意味だろう、と。

このマシンは知っている。まだ書かない。

周婷に、歌を聴きに来てと言われていた。行かなかった。

去年の六月、給水塔。今年の元日、給水塔。

  "file.c2_news.text": `（書き写し　梧城晩報　2000年1月3日　第4面　社会面）

七中の女子生徒、ミレニアムの夜に転落死　事故か

【本紙】1月1日午前6時50分ごろ、梧城七中の用務員が、校内北側の給水塔の下で女子生徒が倒れているのを見つけた。生徒はすでに死亡していた。調べによると、亡くなったのは同校高校三年の周さん（17）。

同校では12月31日夜、ミレニアム祭と年越しカウントダウンが行われており、周さんは零時過ぎにひとりで人の輪を離れたという。警察は事故による転落とみているが、詳しい原因はなお調べている。

学校側によると、給水塔の周辺はふだんから生徒の立ち入りを禁止しており、事故後に囲いを設けた。学校は生徒に対し、休暇中は身の安全に気をつけ、危険な場所に近づかないよう呼びかけている。

（同じ面の下段：東湖公園スケート場、1月8日オープン。入場料3元。）`,

  "file.c2_paper12.html": `<div style="text-align:center;border-bottom:3px double #000;padding-bottom:6px"><b style="font-size:28px;letter-spacing:12px">梧 桐</b><br>梧城七中 学生新聞　1999年12月号（通巻第41号）<br><span style="font-size:12px">発行：校団委　学生編集：宋知遠　蘇芮　レイアウト：許嘉</span></div>
<h3>ミレニアム祭、12月31日夜に開催</h3>
<p>今学期の最終日、校団委は講堂で「新しい千年を迎えよう」ミレニアム祭を開く。演目は十数本、トリは高三(2)組の周婷さんの独唱。閉会後は全校の生徒・教職員がグラウンドで年越しカウントダウンに参加する。各クラスとも安全に気をつけ、先生の指示に従うこと。</p>
<h3>千年虫がやってくる、どうする？</h3>
<p style="font-size:13px">高三(2)組　許嘉</p>
<p>昔のコンピュータは記憶領域を節約するため、年を下二桁だけで記録していた：1999 は 99。2000年になると 99 に 1 を足して 00 になり、1900年だと思い込むプログラムがある。これが「千年虫（2000年問題）」だ。<br>ウイルスではない。うつらないし、エレベーターが落ちてくることもない。問題が起きるのは「年をもとに何かを計算する」プログラム：利息、年齢、期限、並べ替え。<br>本校のパソコン室は12月に順次対策する。詳しくは BBS の「コンピュータ」板を参照。家のパソコンは、フロッピーを持ってパソコン室に来ればパッチをコピーできる。</p>
<h3>【お役立ち情報】元日から梧城の電話番号が八桁に</h3>
<div class="scan" style="padding:8px;font-size:13px">
<p style="text-align:center"><b>梧城市電信局 告示</b>（第 99-27 号）</p>
<p>省郵電管理局の承認を得て、梧城の市内電話網は <b>2000年1月1日零時</b> より、七桁から八桁に変わります。関係事項を以下のとおりお知らせします。</p>
<p>一、桁増やしの方法<br>
（一）旧番号の先頭が「2」「3」「4」のものは、旧番号の前に「8」をつける。例：旧 231 5678 → 新 8231 5678。<br>
（二）旧番号の先頭が「5」「6」のものは、旧番号の前に「6」をつける。例：旧 562 0011 → 新 6562 0011。<br>
（三）旧番号の先頭が「7」「8」のもの（東湖区、梧城開発区）は、旧番号の前に「2」をつける。例：旧 712 3456 → 新 2712 3456。<br>
（四）城西分局管内の局番 340～349（新華路、梧桐路、学府街一帯）は、1999年11月に新城西端局へ切り替え済みのため、<b>第（一）項は適用せず</b>、すべて旧番号の前に「6」をつける。例：旧 342 1100 → 新 6342 1100。</p>
<p>二、特殊番号（110、119、120、122、112、114 など）およびポケベル呼出センターの番号は変わりません。</p>
<p>三、公衆電話（ICカード電話、硬貨式電話を含む）も同時に桁増やしを行います。規則は上と同じです。</p>
<p>四、2000年1月1日から3月31日までを移行期間とし、旧番号にかけると番号変更のアナウンスが流れます。新しい番号は『梧城2000年電話番号簿』（営業所で販売、CD-ROM版もあり）でご確認ください。</p>
<p style="text-align:right">梧城市電信局　1999年12月10日</p>
</div>
<p>（本校の代表番号は 345 1688 から 6345 1688 に変わります。その他の番号は電話帳を参照。）</p>
<h3>大学入試まであと 206 日</h3>
<p>高三の期末試験は1月17日から。冬休みの補講は2月10日から。詳しい予定は追って知らせる。</p>`,
  "file.c2_paper01.html": `<div style="text-align:center;border-bottom:3px double #000;padding-bottom:6px"><b style="font-size:28px;letter-spacing:12px">梧 桐</b><br>梧城七中 学生新聞　2000年1月号（通巻第42号）<br><span style="font-size:12px">発行：校団委　学生編集：宋知遠　蘇芮　レイアウト：許嘉</span></div>
<p style="font-size:12px;text-align:center">今号の表紙：ミレニアムの夜、グラウンドで撮った高三(2)組の集合写真（撮影：高一(3)組　学校写真班）</p>
<h3>こんにちは、2000！——本校ミレニアム祭、盛況のうちに閉幕</h3>
<p>12月31日午後7時、「新しい千年を迎えよう」ミレニアム祭が学校講堂で幕を開けた。オープニングダンス『ミレニアムの光』は熱気にあふれ、高二(1)組の漫才『ぼくと千年虫』は「千年虫」を寒がりの小さな虫に仕立てて、客席の笑いが絶えなかった。高三(2)組のコント『受験カウントダウン』は、高三生の大きな共感を呼んだ。</p>
<p>司会は高三(2)組の蘇芮さんと高二(1)組の程一帆さん。トリは高三(2)組の周婷さんの独唱『零時まで待ってる』。澄んだ歌声に、会場の拍手は長く鳴りやまなかった。</p>
<p>午後11時30分に閉会し、全校の生徒・教職員はグラウンドへ。顧秋白先生の司会で年越しカウントダウンが行われた。「十、九、八……」グラウンドの大時計の鐘の音とともに、2000年がやってきた。花火が上がり、生徒たちは抱き合って新年の願いをかけた。</p>
<h3>パソコン室とサーバー、無事に年越し</h3>
<p>コンピュータ科の先生方によると、12月の対策作業を経て、本校のパソコン室と BBS サーバーは零時に無事 2000年を迎え、異常は見られなかった。</p>
<p class="faded" style="font-size:12px">また：元日未明、本校の高三の女子生徒が校内で事故に遭い、亡くなった。学校は深い哀悼の意を表するとともに、校内の安全管理を強化した。生徒の皆さんは給水塔などの危険な場所に立ち入らないこと。</p>
<h3>期末試験の日程</h3>
<p>高三：1月17日～19日、高一・高二：1月19日～21日。</p>`,

Y2K.lang('ja', {
  "file.c3_damaged.text": "GXMSG/2.1  会話記録ファイル\n自分の番号：3100512\n相手の番号：3100▒▒3\n会話日付：▒▒▒▒-▒▒-▒▒\n記録件数：▒▒\n[検証失敗：ファイルヘッダ CRC エラー 0x7F3A ≠ 0x0000]\n[インデックス領域が破損しているため時刻順に並べ替えできません。鳩信は読み込みを拒否しました]\n\n---- 読み取り可能な断片（セクタ順。時刻順ではありません）----\n\n▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒\n▒▒▒▒学校の推薦入学の内定は来月には決ま▒▒▒▒▒▒▒\n▒▒▒▒▒▒▒▒▒▒▒▒明日はもうバレンタインデー▒▒▒▒▒▒\n▒▒23:1▒:▒▒▒▒▒▒▒「二人目はお前だ。」▒▒▒▒▒\n▒▒▒▒許嘉、僕だ。▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒\n▒▒▒▒▒▒▒▒母は教育局の人事課に▒▒▒▒▒▒▒▒▒\n▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒\n▒▒00:2▒:▒▒▒▒▒▒▒補習で会おう▒▒▒▒▒▒▒▒▒▒▒\n▒▒▒▒▒▒▒▒▒▒六号機▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒\n▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒\n\nC:\\Program Files\\鳩信\\GXREPAIR.EXE を実行して修復してください。",
  "file.c3_repair_txt.text": "GXREPAIR 1.0 —— 鳩信 会話記録修復ツール\n\n用途：\n  会話ファイルのファイルヘッダが破損した（CRC エラー）ときに、インデックスを再構築して鳩信に再インポートします。\n\n手動で入力が必要な情報（2 項目）：\n  1. 相手の鳩信番号（7 桁の数字。鳩信の友だちリストで確認できます）\n  2. 会話日付（最初のメッセージの日付）\n\n注意：\n  * 会話が午前 0 時をまたいでいる場合、日付は開始した日とします。\n  * 2 項目とも正しい場合にのみ検証を通過します。それ以外の場合、データは一切書き込まれません。",
  "file.c3_repair_exe.text": "GXREPAIR 1.0\n\nMSG_BAD.DAT をスキャンしています……\nファイルヘッダを再構築しました。\n自分：3100512    相手：3100233（遠方）\n会話日付：2000-02-13 23:10:42 から\n66 件のメッセージをインポートしました。\n\n修復が完了しました。鳩信で「遠方」とのチャット記録を確認してください。",
  "file.c3_devlog.text": "WTBBS 開発日誌\n（自分用。消すな）\n\n1998-10-03\n書き始め。ASP + Access。PWS を 3 号機で動かす。\nまずスレッド一覧と投稿から。\n\n1998-10-05\nスレッドのタイトルに引用符があると表示が崩れる。エスケープ。\n中国語のユーザー名を Cookie に入れると文字化けする。id だけ保存するように変更。\n\n1998-10-08\n公開。アドレス http://192.168.1.103/\n韓先生が顧問を引き受けてくれた。条件：授業に影響させないこと。\nsysop と jia を登録。\n\n1998-10-09\n磊磊が初日から 40 件投稿。投稿間隔の制限を追加：30 秒。\n\n1998-10-15\n板を追加：おしゃべり広場、コンピュータ、学校生活、気持ちの駅。\nおしゃべり広場は磊磊に任せる。\n\n1998-10-27\nスレッド番号をサイト全体で一つの連番に変更。1001 から。テスト投稿は全部消した。\n\n1998-11-02\n「創作文芸」板を追加。\n板の管理人をやりたいという人がいた。詩を載せたいらしい。任せた。\n\n1998-11-20\nレスが増えるとページ表示が遅い。ページ分割を追加。1 ページ 20 レス。\n\n1998-12-06\n削除：今はデータベース上で非表示フラグを立てるだけ。本当には消さない。ゴミ箱から復元できる。\nTODO：thread.asp が非表示フラグをチェックしていない。とりあえずこのまま。\n\n1998-12-19\nデータベースが 1.2 MB になった。毎週日曜にフロッピーへバックアップ。\n\n1999-01-09\nサイト内メール完成。\nTODO：サイト内メールの送信日時は、当面クライアント側の時刻を使う（送信ページの JavaScript が送信者のパソコンの時計を読み取り、フォームと一緒に送信する）。いずれサーバー時刻に変える。\nサーバー側で直す箇所が多すぎる。期末試験が終わってから。\n\n1999-01-17\n東湖。コードは書かなかった。\n\n1999-01-24\nサイト内メールに「既読」マークを追加。\n受信箱のメールの並び順がおかしいと言われた。原因：一覧は送信日時順に並べているが、パソコンの時計がずれている生徒がいて、その人のメールが変な位置に入る。上の TODO と一緒に直す。\n\n1999-02-20\nログイン記録：ユーザー名、サーバー時刻、IP、マシン名を記録する。\n校内のマシン名はセットアップのときに統一して付けた。部屋名のピンインの頭文字＋番号：パソコン室（机房 jī fáng）JF-01 ～ JF-40、図書館（图书馆 tú shū guǎn）TSG-01、校長室（校长室 xiào zhǎng shì）XZS-01。3 号機は JF-03。\n校外からダイヤルアップ〔拔号〕で来るユーザーは梧城情報港を経由する。IP は 61.153 で始まり、マシン名はない。\n\n1999-03-11\nおしゃべり広場で五筆とピンインのことで言い争って、一晩つぶした。\n結論：ピンインは候補を選ばないといけない。五筆はいらない。反論は受け付けない。\n\n1999-04-02\nパソコン室で sysop でログインしたら、後ろに何人も立っていた。今後気をつける。\n\n1999-04-30\nバージョン 1.2。署名、自己紹介を追加。\n\n1999-05-15\n明日から省都で大会。運営は韓先生に任せた。お知らせを出した。\n\n1999-05-19\n戻った。誰かが sysop で投稿していた。\n削除した。パスワードを変えた。sysop は今後 3 号機でしかログインしない。\n\n1999-05-20\n（書かなかった）\n\n1999-06-22\n創作文芸板の管理人は外さない。\n\n1999-07-15\n夏休み。週に一回、電源を入れに来る。\n\n1999-09-01\n高校三年。\n\n1999-10-02\nバージョン 1.3。README 更新。\n修正：長いスレッドが途中で切れる／検索でスペースが使えない。\n未修正：サイト内メールの時刻の TODO。\n\n1999-11-14\nハードディスクが一度いっぱいになった。一時ファイルを 200 MB 削除。\n\n1999-12-01\n2000年問題（千年虫）の対策作業を開始。学校から担当を任された。\nパッチ：Y2KFIX 2.1。BIOS とシステムの日付処理を修正する。\nパッチを当てていないマシンは、1999-12-31 23:59 を過ぎると年が 1900 に戻る。月・日・時・分はそのまま進む。\nパソコン室の第一陣 10 台（JF-01 ～ JF-10）。\n\n1999-12-02\n3 号機に先にパッチを当てた（サーバー優先）。テスト：時計を手動で 1999-12-31 23:59 にして 1 分待つ → 2000-01-01 になった。正常。元に戻した。\n\n1999-12-08\nパソコン室の第二陣。JF-17 は CD-ROM ドライブが壊れていたので、フロッピーで入れた。\n\n1999-12-15\nパソコン室の第三陣 ＋ 図書館 TSG-01 ＋ 校長室 XZS-01。\nJF-29 はマザーボードの電池が切れていた。交換した。\n\n1999-12-18\nWTBBS の投稿とログの日付フィールドを 4 桁に変更。サイト内メールの送信日時はクライアント側から取るまま。手をつけていない。\n\n1999-12-20\n対策の仕上げ：パソコン室 40 台 ＋ 3 号機 ＋ 図書館 ＋ 校長室、すべて完了。\n一台だけ手をつけていない。\n対策完了のお知らせを投稿した。\n\n1999-12-23\n（別に記録）\n\n1999-12-31\n今夜はパソコン室で一人で年越し。サーバーを見張る。\n23:59:59 → 00:00:00、3 号機の表示は 2000-01-01。BBS 正常。ログイン記録も正常。\n\n2000-01-01\n（もう書かない）\n\n2000-01-16\n馬俊がコンピュータ板に、サイト内メールの日時が 1980 年になっていると投稿。あいつの家のパソコンは CMOS 電池が切れていて、起動すると時計が 1980-01-01 に戻っていた。\nやっぱりあの TODO：サイト内メールの日時は送信者のパソコンの時計から取っている。パソコンの時計が間違っていれば、メールの日時も間違う。\nログイン記録はサーバー時刻なので影響なし。\nもう〔己经〕一年放置している。冬休みに直す。\n\n2000-01-28\n電子カードを公開（バレンタイン用）。カードは DATA\\CARD\\ の下に保存。一枚につき htm ファイル一つ。\nカードの日時はサーバー時刻を使う。今回は手を抜かなかった。\n\n2000-01-30\nサイト内メールの時刻、まだ直していない。\n未来〔末来〕の自分に任せる。",
  "file.c3_note1223.text": "12.23\n\n5 月のサーバーログをもう一度見直した。もう〔己经〕二回見ていたが、今回は一行ずつ見た。\n\n5-17 21:03  sysop  投稿  発信元 192.168.1.107\n\n107 = JF-07。パソコン室。\n外部じゃない。省都でもない。パソコン室の生徒用マシンの一台だ。\n5 月 17 日は月曜日。夜はパソコン室を使う夜間自習の日。\n\n夜間自習でパソコン室を使うときは記録表に名前を書く。記録表はパソコン室の管理者が持っている。\n聞きに行った。原本は持ち出し禁止だと言われ、コピーを一枚とらせてもらった（5 月 17 日のページ）。スキャンしたものをこのフォルダに入れてある。\n\n記録表は第 1 時限と第 2 時限に分かれている。投稿は 21:03。\nJF-07 の欄の名前が、一致した。\n両隣に座っていたのが誰かも、一致した。\n\n名前はここには書かない。\n\nsysop のパスワードは、4 月にパソコン室でログインしたときに見られたものだ。自分の不注意だ。\n\n——\n\n彼女は給水塔の上に座っていたとき、誰がやったのか知っていたんだろうか。\n\n俺が言うべきことじゃない。\n今はここまで。",
  "file.c3_note0215.text": "2.15\n\n朝、学校に着いてから知った。宋知遠。東湖。\n\n一昨日の夜、あいつは鳩信で一時間以上俺と話した。\n一人で出かけるなと言った。誰に呼び出されても行くなと。\nそれでも、あいつは行った。\n\nログイン記録を調べた（サーバー時刻）：\n19:52  wanfeng ログイン\n19:55  wanfeng が yuanfang にサイト内メールを送信\n19:58  yuanfang ログイン。自宅からダイヤルアップ〔拔号〕。あいつは読んだ。\n21:14  Y2K ログイン\n21:16  Y2K が『二人目』を投稿\n\nwanfeng。林晩のアカウント。\n彼女のパスワードは俺も知らない。誰なら知っている？\n\n二通のメール（千年虫からあいつへの一通、晩風からあいつへの一通）は、どちらも送信日時が 1900 年。\nこれが何を意味するかはわかっている。\nまだ書かない。先に確かめないと。\n\n蘇芮。明日、必ず話す。\n\n————\nあの夜、俺があいつの代わりに通報するべきだった。",
  "file.c3_signin.caption": "利用記録表_0517.jpg —— コピーのスキャン。1 / 4 ページ（JF-01 ～ JF-10）。",
  "file.c3_signin.html": "<div class=\"scan\" style=\"padding:18px 22px;font-family:SimSun,'Songti SC',serif;color:#2b2416;\">\n<div style=\"text-align:center;font-size:18px;font-weight:bold;letter-spacing:4px;\">梧城市第七中学 パソコン室利用記録表</div>\n<div style=\"display:flex;justify-content:space-between;margin:8px 0 10px;font-size:13px;\">\n<span>日付：<span class=\"hand\" style=\"font-size:15px;\">1999 年 5 月 17 日（月曜日）</span></span>\n<span>時間帯：夜間自習</span>\n<span>第 <span class=\"hand\">1</span> ページ</span></div>\n<table style=\"width:100%;border-collapse:collapse;font-size:13px;text-align:center;\">\n<tr style=\"background:rgba(0,0,0,0.06);\">\n<th style=\"border:1px solid #6b5d40;padding:4px;width:16%;\">機番</th>\n<th style=\"border:1px solid #6b5d40;padding:4px;\">第 1 時限<br><span style=\"font-weight:normal;font-size:12px;\">18:40 — 20:00</span></th>\n<th style=\"border:1px solid #6b5d40;padding:4px;\">第 2 時限<br><span style=\"font-weight:normal;font-size:12px;\">20:10 — 21:30</span></th>\n<th style=\"border:1px solid #6b5d40;padding:4px;width:22%;\">備考</th></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-01</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">（判読できない署名）</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">（判読できない署名）</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-02</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">劉洋</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">劉洋</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:12px;\">ゲームをしていた。注意済み</td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-03</td><td colspan=\"2\" style=\"border:1px solid #6b5d40;color:#7a6a48;\">サーバー · 生徒は使用不可</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-04</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">王磊</td><td class=\"faded\" style=\"border:1px solid #6b5d40;\">—</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-05</td><td class=\"faded\" style=\"border:1px solid #6b5d40;\">—</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">（判読できない署名）</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-06</td><td class=\"faded\" style=\"border:1px solid #6b5d40;\">—</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:16px;\">宋知遠</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-07</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:16px;\">陳小雨</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:16px;\">蘇芮</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:12px;\">第 1 時限 作文を 2 枚印刷</td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-08</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">孫倩</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:16px;\">周婷</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-09</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">（判読できない署名）</td><td class=\"faded\" style=\"border:1px solid #6b5d40;\">—</td><td class=\"hand\" style=\"border:1px solid #6b5d40;font-size:12px;\">マウス故障</td></tr>\n<tr><td style=\"border:1px solid #6b5d40;padding:5px;\">JF-10</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">趙鵬</td><td class=\"hand\" style=\"border:1px solid #6b5d40;\">馬俊</td><td style=\"border:1px solid #6b5d40;\"></td></tr>\n</table>\n<div style=\"margin-top:10px;font-size:12px;display:flex;justify-content:space-between;\">\n<span>利用上の注意：一人一台。機番の欄に署名すること。ゲーム禁止。退室前に電源を切ること。</span>\n<span>管理者署名：<span class=\"hand\">（判読不能）</span></span></div>\n<div class=\"hand\" style=\"margin-top:8px;font-size:13px;color:#8a2a1a;transform:rotate(-2deg);\">（コピーの右上に許嘉の鉛筆書き   "file.c3_news.caption": "夕刊_0216.jpg —— 『梧城晩報』2000 年 2 月 16 日 第 3 面、切り抜きのスキャン。",
  "file.c3_news.html": "<div class=\"scan\" style=\"padding:16px 20px;font-family:SimSun,'Songti SC',serif;color:#222;\">\n<div style=\"display:flex;justify-content:space-between;border-bottom:3px double #333;padding-bottom:4px;font-size:12px;\">\n<span style=\"font-size:20px;font-weight:bold;letter-spacing:6px;\">梧城晩報</span>\n<span>2000 年 2 月 16 日　水曜日　旧暦正月十二日　第 3 面 · 社会</span></div>\n<div style=\"display:flex;gap:16px;margin-top:10px;\">\n<div style=\"flex:2;border-right:1px solid #999;padding-right:14px;\">\n<div style=\"font-size:18px;font-weight:bold;margin-bottom:6px;\">七中の生徒、東湖で溺死</div>\n<div style=\"font-size:13px;line-height:1.75;text-indent:2em;\">【本紙】2 月 15 日午前 7 時ごろ、東湖公園で朝の運動をしていた市民が、北岸付近の氷面に割れた穴があり、その縁に手袋が片方残されているのを見つけ、通報した。引き上げられた遺体は、市立第七中学校の高校三年生・宋さん（17）と確認された。</div>\n<div style=\"font-size:13px;line-height:1.75;text-indent:2em;\">警察の初期調査によると、宋さんは 14 日夜八時ごろ一人で家を出たあと、東湖北岸付近で立ち入りが許可されていない氷の上に入り、誤って氷の穴に落ちたとみられる。現場に争った形跡はなかった。警察は、夜間に一人で氷に乗り、足を踏み外して転落したものとみている。</div>\n<div style=\"font-size:13px;line-height:1.75;text-indent:2em;\">東湖公園管理事務所は市民に対し、立春を過ぎて気温が上がり、湖の氷が薄くなり始めているとして、「危険」と表示された氷穴区域には絶対に立ち入らないよう呼びかけている。屋外スケート場は予定を早め、今月 20 日に閉鎖される。</div>\n</div>\n<div style=\"flex:1;font-size:12px;line-height:1.6;\">\n<div style=\"font-weight:bold;font-size:14px;\">短信</div>\n<div style=\"margin:4px 0;\">· 梧桐路の元宵節灯籠祭り、19 日から開催。入場にはチケットが必要。</div>\n<div style=\"margin:4px 0;\">· 本市の電話番号の桁増しに伴い、一部の旧式電話機は営業所で無料調整が受けられる。</div>\n<div style=\"margin:4px 0;\">· 新華書店に大学入試対策書の専用コーナーがオープン。</div>\n<div style=\"margin-top:10px;border:1px solid #555;padding:6px;text-align:center;\">\n<b>金穂 リピート学習機</b><br>英語リスニングの強い味方<br>五一百貨店 2 階</div>\n</div></div></div>",
